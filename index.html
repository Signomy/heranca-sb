nyYgdN_hFHWA_gdUHR6vt83RWTtsNKG/view", "drivePreviewUrl": "https://drive.google.com/file/d/1gnyYgdN_hFHWA_gdUHR6vt83RWTtsNKG/preview"}, {"id": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_09Jan2015_Dissolucao_Empresa_e_Seguradora.png", "name": "Email_Advogado_Nuno_Trindade_Lourenco_09Jan2015_Dissolucao_Empresa_e_Seguradora.png", "title": "Comunicação Dr. Nuno Trindade Lourenço (09/01/2015) — Processo na Seguradora e Dissolução da Sociedade", "relPath": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_09Jan2015_Dissolucao_Empresa_e_Seguradora.png", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/Email_Advogado_Nuno_Trindade_Lourenco_09Jan2015_Dissolucao_Empresa_e_Seguradora_TRANSCRICAO.txt", "ext": "png", "category": "4. Sociedade & Seguradora", "essential": true, "order": 43, "sizeKb": 619.5, "transcriptText": "======================================================================\nDOCUMENTO: Comunicação Dr. Nuno Trindade Lourenço (09/01/2015) — Processo na Seguradora e Dissolução da Sociedade\nCATEGORIA: 4. Sociedade & Seguradora\nFICHEIRO ORIGINAL: 09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_09Jan2015_Dissolucao_Empresa_e_Seguradora.png\n======================================================================\n\nmail.google.com\n\"\" C\n+\nM\nP\nP\nG\nG\nP\nP\nP\nP\nM\nM Fwd: Notícias. - ang...\nM\n=\nGmail\nQ\nntrindadel\n?\nMelhorar\n/ Compor\nE\n:\n3 de 50\nData: 9 de janeiro de 2015 12:09\nAssunto: Notícias.\nCaixa de entrada\nPara: graciete novo < liciska38@gmail.com>\nCom estrela\nSuspenso\nExmos. Srs.\nGraciete Novo\nD\nImportante\nLiliana Lima\nEnviado\nÂngelo Bártolo\nMarisa Bártolo:\nRascunhos\n191\nAntes de mais, apresento as M. sinceras desculpas pela demora.\nTal facto prendeu-se com a intenção de ter mais elementos referentes ao processo com a seguradora (a qual ainda não decidiu sobre o pagamento ou não do empréstimo contraído pelo V. pai para\nCompras\n533\naquisição de imóvel), bem como do processo de contra-ordenação em que a sociedade de cujas quotas V. Exas. são herdeiros foi condenada pela autoridade administrativa ao pagamento de\nAtualizações\n18 381\n38.000€ e no qual apresentamos recurso.\nNo dia de ontem foi realizada a leitura de sentença, na qual nos foi dada razão, sendo a sentença no sentido de declarar a nulidade da decisão administrativa e dar razão à N. posição.\nFóruns\n17\nAssim sendo, e porque a sociedade não tem activo nem passivo, poderemos proceder à dissolução e encerramento da mesma, evitando assim despesas desnecessárias, como a contabilidade,\nque tem sido suportada pela Cabeça de Casal. Para tal será necessária a assinatura de uma acta, a qual, logo que na M. posse, caso concordem e por uma questão de facilidade, poderemos\nMais\nenviar digitalizada para V. assinatura.\nAnexo documentos referentes ao passos dados até ao momento, com excepção da habilitação de herdeiros que, já realizada, não tenho na M. posse:\n+\n- imposto de selo;\nMarcadores\n- n° contribuinte herança.\nCaso desejem, poderei enviar a sentença da decisão de ontem, no processo 2414/14.0 TBVFX, bem como comunicação da seguradora a solicitar documentação médica.\nNotes\nAlguma dúvida, queiram por favor dispor\nPessoal\nNuno Trindade Lourenço\nPublicidade\n10 612\nTrabalho\nDate: Sun, 17 Aug 2014 09:09:57 +0100\nSubject: Re: Aguardo noticias\nDESBRVADORES\n90\nFrom: liciska38@gmail.com\nMais\nTo: ntrindadel@hotmail.com\nBom dia Dr Nuno\nAinda estou a espera da documentação solicitada.\nAgradeço o envio\n* Responder\n~ Encaminhar", "driveId": "11xImNe7wg0ZLkFoJhHFpxDOuh715uWlA", "driveViewUrl": "https://drive.google.com/file/d/11xImNe7wg0ZLkFoJhHFpxDOuh715uWlA/view", "drivePreviewUrl": "https://drive.google.com/file/d/11xImNe7wg0ZLkFoJhHFpxDOuh715uWlA/preview"}, {"id": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_03Mar2015_Urgencia_Dissolver_Empresa_e_Seguradora.png", "name": "Email_Advogado_Nuno_Trindade_Lourenco_03Mar2015_Urgencia_Dissolver_Empresa_e_Seguradora.png", "title": "Comunicação Dr. Nuno Trindade Lourenço (03/03/2015) — Pedido de Assinatura da Dissolução e Seguradora", "relPath": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_03Mar2015_Urgencia_Dissolver_Empresa_e_Seguradora.png", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/Email_Advogado_Nuno_Trindade_Lourenco_03Mar2015_Urgencia_Dissolver_Empresa_e_Seguradora_TRANSCRICAO.txt", "ext": "png", "category": "4. Sociedade & Seguradora", "essential": false, "order": 44, "sizeKb": 565.2, "transcriptText": "======================================================================\nDOCUMENTO: Comunicação Dr. Nuno Trindade Lourenço (03/03/2015) — Pedido de Assinatura da Dissolução e Seguradora\nCATEGORIA: 4. Sociedade & Seguradora\nFICHEIRO ORIGINAL: 09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_03Mar2015_Urgencia_Dissolver_Empresa_e_Seguradora.png\n======================================================================\n\nmail.google.com\n»» O\nM\nP\nP\nP\nP\nP\nP\nP\nM\nM Herança de Serafim...\nM\n=\nGmail\nQ\nntrindadel\n•\nMelhorar\n/ Compor\n:\n4 de 50\nCaixa de entrada\nHerança de Serafim Bártolo.\nCaixa de entrada x\nCom estrela\nNuno Trindade Lourenço < ntrindadel@hotmail.com>\nterça, 3/03/2015, 16:45\n:\npara limaliliana85@gmail.com, mim, mary-novo@hotmail.com ~\nSuspenso\nExmos. Senhores:\nD\nImportante\nComo oportunamente comunicado e enviado à Sra. V. mãe, a sentença referente ao processo da multa da empresa foi-nos favorável. Contudo a sentença manda remeter o processo para a\n→\nEnviado\nautoridade autuante, pelo que poderemos ter novamente que nos opor.\nAssim sendo, e porque a empresa neste momento apenas gera despesas, não se encontrando há mais de um ano a trabalhar, haverá que a dissolver o mais rapidamente possível. Em relação a tal\nRascunhos\n191\naguardo resposta. em caso de existir disponibilidade, remeterei a acta para ser por V. assinada. (este pedido já foi enviado há quase dois meses).\nA situação da casa encontra-se a aguardar decisão final da seguradora.\nCompras\n533\nCaso tenham dúvidas, indiquem contacto que eu ligo.\nAtualizações\n18 381\nAlguma dúvida, por favor disponham\nP Fóruns\n17\nNuno Trindade Lourenço\nMais\nMarcadores\n+\n[Mensagem reduzida] Ver toda a mensagem\nNotes\nPessoal\nAngelo Bartolo < angelo.nbartolo@gmail.com>\nquinta, 6/02/ 2020, 17:11 |\npara Mariana -\nPublicidade\n10 612\n...\nTrabalho\nDESBRVADORES\n90\nMais\nÂngelo Bártolo - www.amart-photography.com - 964622555\n4 Responder\n~ Encaminhar", "driveId": "1_wplRntlIQK6bKT3A8tVupuUGCiDuNw1", "driveViewUrl": "https://drive.google.com/file/d/1_wplRntlIQK6bKT3A8tVupuUGCiDuNw1/view", "drivePreviewUrl": "https://drive.google.com/file/d/1_wplRntlIQK6bKT3A8tVupuUGCiDuNw1/preview"}, {"id": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2015-01-08_Sentenca_Tribunal_VFX_Proc_2414_14_Anula_Coima_38500eur_Safarimedieval.pdf", "name": "2015-01-08_Sentenca_Tribunal_VFX_Proc_2414_14_Anula_Coima_38500eur_Safarimedieval.pdf", "title": "Sentença Judicial (Proc. 2414/14.9T8VFX — 08/01/2015) — Arquivamento da Coima de 38.500 € da Safarimedieval", "relPath": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2015-01-08_Sentenca_Tribunal_VFX_Proc_2414_14_Anula_Coima_38500eur_Safarimedieval.pdf", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2015-01-08_Sentenca_Tribunal_VFX_Proc_2414_14_Anula_Coima_38500eur_Safarimedieval_TRANSCRICAO.txt", "ext": "pdf", "category": "4. Sociedade & Seguradora", "essential": false, "order": 45, "sizeKb": 344.4, "transcriptText": "======================================================================\nDOCUMENTO: Sentença Judicial (Proc. 2414/14.9T8VFX — 08/01/2015) — Arquivamento da Coima de 38.500 € da Safarimedieval\nCATEGORIA: 4. Sociedade & Seguradora\nFICHEIRO ORIGINAL: 09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2015-01-08_Sentenca_Tribunal_VFX_Proc_2414_14_Anula_Coima_38500eur_Safarimedieval.pdf\n======================================================================\n\n--- PÁGINA 1 ---\n125\nComarca de Lisboa Norte\nPalácio da Justiça, Praceta da Justiça - 2601-502 Vila Franca de Xira\nV.F.Xira - Inst. Local - Secção Criminal - J2\nTelef: 263285760 Fax: 263093589 Mail: vixira.to@tribunais.org.pt\nProcesso n. ° 2414/14.0TBVFX\nI - Relatório\nA sociedade Safari Medieval - Comércio de Sucatas, Lda, com sede na Rua\nJosé Costa e Silva, n.° 72, R/c Dto, em Vila Franca de Xira, foi condenada no processo\nde contra-ordenação n.° 500.30.10.00073/2014 pela Comissão de Coordenação e\nDesenvolvimento Regional de Lisboa e Vale do Tejo no pagamento de uma coima única\nde € 38.500,00 (trinta e oito mil e quinhentos euros), acrescida das respectivas custas do\nprocesso, pela prática de uma contra-ordenação muito grave e de uma contra-ordenação\ngrave, previstas e puníveis pelo artigo 67°, n.º 1, al. d) e n.° 2, al. r) do DL n.° 178/2006\nde 05.09., alterado pelo DL n.° 73/2011 de 17 de Junho, por violação, respectivamente,\ndo disposto no art. 9.°, n.° 2 conjugado com o art. 23.°, n.° 1 e do disposto no art. 48.°,\nn.° 1 do mesmo diploma.\nInconformada com aquela decisão veio a arguida interpor recurso da mesma,\ninvocando a nulidade da decisão administrativa, porquanto a mesma é omissa em\nrelação aos factos que estão subjacentes à imputação da prática das contra-ordenações\nem causa. A este propósito alega que não refere quais são os resíduos em causa, quais os\nactos de gestão praticados e quem efectivamente os praticou.\nConclui, pedindo a declaração de nulidade da decisão recorrida.\n*\nRealizou-se a audiência de discussão e julgamento com observância do\nformalismo legal.\n*\n\n--- PÁGINA 2 ---\n126\nV.F.Xira - Inst. Local - Secção Criminal - J2\nComarca de Lisboa Norte\nTelef: 263285760 Fax: 263093589 Mail: vfxira.to@tribunais.org.pt\nPalácio da Justiça, Praceta da Justiça - 2601-502 Vila Franca de Xir\nO Tribunal é competente.\n*\nQuestão Prévia:\nDa nulidade da decisão da autoridade administrativa\nA recorrente veio no âmbito do recurso de impugnação judicial invocar a nulidade\nda decisão administrativa, por omissão dos factos que constituem o elemento objectivo\ne subjectivo das contra-ordenações em causa.\nCumpre, antes de mais, conhecer da nulidade que a recorrente aponta à decisão\nadministrativa como questão prévia.\nDispõe o art. 58° do Regime Geral das Contra-Ordenações e Coimas (RGCO)\n\"1- A decisão que aplica a coima ou as sanções acessórias deve conter\na) A identificação dos arguidos;\nb) A descrição dos factos imputados, com indicação das provas obtidas;\nc) A indicação das normas segundo as quais se pune e a fundamentação\nda decisão;\nd) A coima e as sanções acessórias.\n2- Da decisão deve ainda constar a informação de que:\na) A condenação se torna definitiva e exequível se não for judicialmente\nimpugnada nos termos do art.59°;\nb) Em caso de impugnação judicial o Tribunal pode decidir mediante\naudiência, ou, caso o arguido e o Ministério Público não se\noponham, mediante simples despacho.\n3- A decisão conterá ainda:\na) A ordem de pagamento da coima no prazo máximo de 10 dias após o\ncarácter definitivo ou o trânsito em julgado da decisão;\nb) A indicação de que em caso de impossibilidade de pagamento\ntempestivo deve comunicar o facto por escrito à entidade que aplicou\na coima.\"\n\n--- PÁGINA 3 ---\n127\nV.F.Xira - Inst. Local - Secção Criminal - J2\nComarca de Lisboa Norte\nPalácio da Justiça, Praceta da Justiça - 2601-502 Vila Franca de Xira\nTelef: 263285760 Fax: 263093589 Mail: vfxira.to@tribunais.org.pt\nAtenta a natureza do regime contra-ordenacional, à decisão administrativa\naplicam-se as exigências formais referidas no preceito em análise, coincidentes com as\nprevistas no processo penal.\nÀ decisão deverá, assim, conter, todos os elementos essenciais para, caso haja\nimpugnação, valer como acusação e, caso não haja, valer como decisão condenatória.\nEm termos substanciais, a decisão administrativa condenatória deverá conter uma\ndescrição de factos que permitam satisfazer o preenchimento da conduta tipificada\ncomo ilícita, fazendo menção a toda a factualidade relativa à culpabilidade, dos quais\nseja possível aferir o cohecimento e representação da vontade de realização do facto\nmaterial típico da infracção - cfr. Arts. 58° RGCO, 374º e 379° do CPP.\nOs requisitos previstos no art. 58º do RGCO visam assegurar ao arguido a\npossibilidade de exercício efectivo dos seus direitos de defesa, o qual só poderá ser\ndevidamente exercido se este tiver um conhecimento perfeito dos factos que lhe são\nimputados, das normas legais aplicáveis e das condições em que pode impugnar\njudicialmente a decisão administrativa.\nTais garantias de defesa em sede contra-ordenacional têm protecção constitucional\n- cfr. Art. 32° n°10 da CRP.\nOra, compulsados os autos, constata-se que os factos dados como provados na\nreferida decisão são insuficientes para que a arguida possa ser condenada pelas\ninfracções que lhe são imputadas nos autos.\nDe facto, se atentarmos ao texto de onde consta a decisão condenatória,\nverificamos que tal peça processual não cumpre os requisitos exigidos pelo mencionado\nart. 58º do RGCO, na medida em que a factualidade constante da mesma e que diz\nrespeito ao elemento objectivo é alegada de modo genérico e conclusivo.\nSenão vejamos.\nRefere-se no ponto 1 dos factos provados que foi presenciado na acção de\nfiscalização efectuada, que a empresa arguida realiza operações de gestão de resíduos\nsem o licenciamento devido. Contudo, não foram descritas quaisquer operações ou\nsequer que tipo de actividade era executada na mesma, impondo-se necessariamente que\nse questione: que tipo de operações são realizadas pela recorrente? E que resíduos estão\n\n--- PÁGINA 4 ---\n128\nComarca de Lisboa Norte\nPalácio da Justiça, Praceta da Justiça - 2601-502 Vila Franca de Xir\nV.F.Xira - Inst. Local - Secção Criminal - J.\nTelef: 263285760 Fax: 263093589 Mail: vfxira.to@tribunais.org.pt\nem causa? É que só depois de descritas essas operações, o tribunal poderá concluir que\nas mesmas se enquadram no conceito de operações de gestão de resíduos.\nPor outro lado, refere-se igualmente no ponto 2 dos factos provados que a arguida\nnão se encontra inscrita no SIRER na qualidade de operador que actua no mercado de\nresíduos.\nOra, também neste tocante a factualidade descrita é insuficiente para que a arguida\npossa ser condenada pela infracção que lhe é imputada, porquanto a afirmação em\ncausa, para além de conclusiva, não assenta em nenhum facto concreto e objectivo,\ndesignadamente no que respeita ao objecto social da empresa. Na verdade, não é\nalegado pela autoridade administrativa qual a actividade a que se dedica a empresa\narguida para que dessa forma se possa extrair a conclusão de que a mesma é um\noperador que actua no mercado de resíduos.\nAliás, refira-se ainda nesta matéria que a autoridade administrativa imputa esta\ncontra-ordenação por referência ao artigo 48.°, n.° 1 do DL n.° 178/2006. Contudo, se se\natentar no referido preceito é dado verificar que o mesmo contém sete alíneas onde\nestão descritos diversos tipos de actividade a que se dedicam as pessoas colectivas que\nestão\nsujeitas a inscrição no SIRER, sendo certo que na decisão administrativa em\napreço há apenas referência ao n.° 1 do art. 48.º do referido diploma legal sem que se\nfaça qualquer menção à alínea que é aplicável ao caso vertente.\nOra, a decisão condenatória não pode limitar-se a alegar factos conclusivos sem\nqualquer tipo de concretização concreta e objectiva, nem tão pouco indicar normas\nlegais de modo genérico, exigindo-se, quer em face do art. 58º do RGCO quer atento o\ndisposto no art. 32° nº10 da CRP, que o decisor determine a coima e as sanções\nacessórias que ao caso couberem, fundamentando minimamente tal decisão - cfr. nesse\nsentido Ac. Relação de Coimbra datado de 24.04.2003, in www.dgsi.pt.\nNo caso em apreço, a decisão condenatória não se encontra fundamentada do\nponto de vista factual, não constando da mesma a descrição de factos essenciais dos\nquais decorre a imputação das infracções em causa.\nCom efeito, analisando o teor da decisão verifica-se que a mesma omite que tipo\nde operações eram realizadas pela recorrente nas instalações onde foi realizada a\n\n--- PÁGINA 5 ---\n129\nComarca de Lisboa Norte\nPalácio da Justiça, Praceta da Justiça - 2601-502 Vila Franca de Xira\nV.F.Xira - Inst. Local - Secção Criminal - J2\nTelef: 263285760 Fax: 263093589 Mail: vfxira.to@tribunais.org.pt\nfiscalização, assim como não alega que tipo de actividade era desenvolvida pela\nsociedade arguida, sendo que só a alegação de tais factos permitirá apreciar se foram ou\nnão praticadas as infracções que estão em causa nestes autos.\nAcresce que, na decisão recorrida também não é feita referência à alínea do n.° 1\ndo art. 48 do DL n.° 178/2006 que está em causa e que é aplicável ao caso.\nOra, conforme já salientámos, a imputação de factos numa decisão condenatória,\nnão pode ser genérica e conclusiva. Pelo contrário, tem de ser precisa e concreta,\nrecortando com nitidez os factos relevantes para caracterizarem o comportamento\ncontra-ordenacional, nomeadamente os seus elementos objectivos e subjectivos - cfr.\nnesse sentido Ac. STJ de 6.11.2008, in www.dgsi.pt.\nIncumbe à entidade administrativa fazer prova dos factos constitutivos da\ninfracção, nomeadamente os atinentes ao elemento objectivo, ou seja, tais factos\ncarecem de prova positiva, pelo que têm de estar alegados na decisão administrativa.\nFaltam, assim, os factos que constituem o elemento objectivo da infracção, sem os\nquais não pode ser condenada a arguida pela prática de qualquer contra-ordenação.\nNão pode, assim, a decisão objecto de impugnação ser apreciada pelo Tribunal,\numa vez que a mesma não contém elementos que a lei reputa como fundamentais.\nConstatada a presente situação, cumpre decidir qual a consequência jurídica a que\na mesma levará.\nSendo certo que, muito embora existam dois entendimentos distintos a este\npropósito, ambos conduzem à mesma consequência - a remessa dos autos à autoridade\nadministrativa que proferiu a decisão para suprir tal omissão.\nAssim:\nPara quem entenda que a violação deste normativo é cominada com a nulidade, à\nsemelhança das sentenças penais ( 379°, do C.P.C. ex vi do artigo 41°, 1, do Dec.-Lei n°\n433/82), importaria declarar nula a decisão administrativa e determinar a remessa dos\nautos à origem a fim de ser suprida tal omissão.\nPara quem entenda, finalmente que, uma vez que a violação do disposto no artigo\n58°, do R.G.C.O. não é cominada com nulidade, na esteira do entendimento de António\nBeça Pereira, in R.G.C.O. anotado, 3ª Ed., pág. 104 a 106, entendendo que se está\n\n--- PÁGINA 6 ---\n130\nV.F.Xira - Inst. Local - Secção Criminal - J2\nComarca de Lisboa Norte\nTelef: 263285760 Fax: 263093589 Mail: vfxira.to@tribunais.org.pt\nPalácio da Justiça, Praceta da Justiça - 2601-502 Vila Franca de Xira\nperante irregularidades da decisão condenatória, nos termos do artigo 123°, n.º 2, do\nC.P.P., uma vez que a irregularidade afecta, sem margem para dúvidas, o valor do acto\npraticado, cumpre ordenar a sua reparação, ordenando-se a sua remessa à autoridade\nadministrativa para proferir nova decisão em que seja cumprido o disposto no artigo\n58°, do R.G.C.O. em todos os pontos supra referidos.\nNa nossa perspectiva, a omissão da decisão administrativa dos factos atinentes aos\nelementos objectivo s do s ilicito.s contra -ordenacionais em causa consubstancia uma\nnulidade, à semelhança do que acontece com as decisões judiciais, ou seja, sufragamos a\nprimeira posição exposta - cfr. art.° 379°, n.°l, al. a), art.° 374.°, n.ºl e n.2 e art.° 118,\nn.° 1 do CPP e art.° 41.°, n.° 1 do RGCO; vide ainda RGCO anotado, Simas Santos e\nLopes de Sousa. - nulidade essa que pode ser conhecida oficiosamente e em recurso\ninterposto, atento o disposto no art. 379° nº2 do CPP - cfr. nesse sentido Acs. RP de\n29.09.2004 e 30.03.2005 e RL 10.02.2004, in www.dgsi.pt e este último em CJ, ano XXIX, TI, p. 130.\nDeste modo, declaro nula a decisão administrativa e determino a remessa dos\nautos à autoridade administrativa a fim de ser suprida a omissão descrita.\nSem custas.\nNotifique.\nApós trânsito, remeta os autos à autoridade administrativa para reparação nos\ntermos sobreditos.\n***\nVila Franca de Xira, 8 de Janeiro de 2015\n(Elaborado e processado a computador e revisto pela signatária)\nJornais", "driveId": "1WYrIdaktx19W8FYKiDUUCmYGTyeF529_", "driveViewUrl": "https://drive.google.com/file/d/1WYrIdaktx19W8FYKiDUUCmYGTyeF529_/view", "drivePreviewUrl": "https://drive.google.com/file/d/1WYrIdaktx19W8FYKiDUUCmYGTyeF529_/preview"}, {"id": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Print_Pesquisa_Publicacoes_MJ_Safarimedieval_509474110.png", "name": "Print_Pesquisa_Publicacoes_MJ_Safarimedieval_509474110.png", "title": "Registo de Publicações Societárias no Portal da Justiça — Safarimedieval, Lda. (NIPC 509474110)", "relPath": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Print_Pesquisa_Publicacoes_MJ_Safarimedieval_509474110.png", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/Print_Pesquisa_Publicacoes_MJ_Safarimedieval_509474110_TRANSCRICAO.txt", "ext": "png", "category": "4. Sociedade & Seguradora", "essential": false, "order": 46, "sizeKb": 647.7, "transcriptText": "======================================================================\nDOCUMENTO: Registo de Publicações Societárias no Portal da Justiça — Safarimedieval, Lda. (NIPC 509474110)\nCATEGORIA: 4. Sociedade & Seguradora\nFICHEIRO ORIGINAL: 09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Print_Pesquisa_Publicacoes_MJ_Safarimedieval_509474110.png\n======================================================================\n\nSafari\nFicheiro\nEdição\nVisualização\nHistórico\nMarcadores\nJanela\nAjuda\nDEPA\nA\nQ\n8\nsáb. 17/10 00:23\n•\n• •\n© publicacoes.mj.pt\nPublicações de Atos Societários e de outras entidades\nREPUBLICA\nPORTUGUESA\nJUSTICA\nPublicação\nNIF/NIPC\n509474110\nEntidade\nSAFARIMEDIEVAL COMÉRCIO DE SUCATAS LDA\nData Publicação\n2015-07-20\nPublica-se que em relação à entidade:\nN° de Matrícula/NIPC: 509474110\nNatureza Jurídica: SOCIEDADE POR QUOTAS\nFirma: SAFARIMEDIEVAL COMÉRCIO DE SUCATAS LDA\nSede: Rua José da Costa e Silva, n° 72, r/c dt°\n2600 Vila Franca de Xira\nDistrito: Lisboa Concelho: Vila Franca de Xira Freguesia: Vila Franca de Xira\nMatriculada na: CRC de Vila Franca de Xira\npelo pedido Dep 2258/ 2015-07-20, foi efectuado o seguinte acto de registo:\nDEP 2258/2015-07-20 18:59:54 UTC - ACTUALIZAÇÃO PRESTAÇÃO DE CONTAS INDIVIDUAL\nAno da Prestação de Contas: 2013 (2013-01-01 a 2013-12-31)\nquerente e Responsável pelo Registo: SAFARIMEDIEVAL COMERCIO DE SUCATAS L\nncão realizada nos termos do Decreto-Lei no. 8/2007 de 17 Jane\nOs dados constantes dos documentos que serviram de base ao presente registo encontram-se depositados, por transmissão electrónica, na Base de Dados de Contas Anuais.\nDesenvolvimento: IGFEJ\nLINHA registos\nHelp Desk - Correio eletrónico: publicacoes@irn.mj.pt\n211 950 500\nHelp-Desk do serviço de certidões permanentes - Correio electrónico: certidaopermanente@irn.mj.pt\nPARA CONTACTOS DO ESTRANGER\n4357)210SOO", "driveId": "1ad1kiLdMHBANUZQbtlx1gM12QRHAG2o4", "driveViewUrl": "https://drive.google.com/file/d/1ad1kiLdMHBANUZQbtlx1gM12QRHAG2o4/view", "drivePreviewUrl": "https://drive.google.com/file/d/1ad1kiLdMHBANUZQbtlx1gM12QRHAG2o4/preview"}, {"id": "10_Certidoes_Oficiais_Contas_Anuais_Safarimedieval/RELATORIO_CERTIDOES_CONTAS_2012_2013_2014.md", "name": "RELATORIO_CERTIDOES_CONTAS_2012_2013_2014.md", "title": "Análise Contabilística e Jurídica das Certidões IES (2012, 2013 e 2014) — Safarimedieval, Lda.", "relPath": "10_Certidoes_Oficiais_Contas_Anuais_Safarimedieval/RELATORIO_CERTIDOES_CONTAS_2012_2013_2014.md", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/RELATORIO_CERTIDOES_CONTAS_2012_2013_2014_TRANSCRICAO.txt", "ext": "md", "category": "4. Sociedade & Seguradora", "essential": false, "order": 47, "sizeKb": 3.3, "transcriptText": "======================================================================\nDOCUMENTO: Análise Contabilística e Jurídica das Certidões IES (2012, 2013 e 2014) — Safarimedieval, Lda.\nCATEGORIA: 4. Sociedade & Seguradora\nFICHEIRO ORIGINAL: 10_Certidoes_Oficiais_Contas_Anuais_Safarimedieval/RELATORIO_CERTIDOES_CONTAS_2012_2013_2014.md\n======================================================================\n\n# Certidões Oficiais de Contas Anuais — Safarimedieval, Lda. (NIPC 509474110)\nCódigo da certidão: `8634-0404-5875` (IRN, pago a 17/10/2026, documento de cobrança IES-53769421)\n\n## Que versão é cada ano\n| Ano | Versão na certidão | Data de receção |\n|---|---|---|\n| 2012 | 1.ª Declaração do Ano (original, nunca alterada) | 14/07/2013 |\n| 2013 | **Declaração de Substituição** (a versão alterada) | **20/07/2015** |\n| 2014 | **Declaração de Substituição** (a versão alterada) | **17/07/2015** |\n\n> A versão original de 2013 (entregue em julho de 2014) NÃO está nesta certidão. Tem de ser pedida à Conservatória.\n\n## Números principais (em euros)\n| Rubrica | 31/12/2012 | 31/12/2013 | 31/12/2014 |\n|---|---|---|---|\n| Vendas | 111.360,12 | 113.250,29 | 0,00 |\n| Resultado líquido | -27.911,42 | -6.846,03 | -3.864,79 |\n| Ativos fixos tangíveis | 750,00 | 1.300,00 | 1.050,00 |\n| Inventários (stock) | 0,00 | 0,00 | 0,00 |\n| Clientes | 0,00 | 2.404,00 | 0,00 |\n| Caixa e depósitos | 6.911,00 | 2.998,72 | 2.849,56 |\n| **Total do ativo** | 8.388,22 | 8.576,98 | **5.829,02** |\n| **Empréstimos dos sócios (\"Participantes de capital\")** | 30.889,02 | **38.082,04** | **39.291,45** |\n| Total do passivo | 31.299,64 | 38.334,43 | **39.451,26** |\n| Capital próprio | -22.911,42 | -29.757,45 | -33.622,24 |\n| Pessoas ao serviço (média) | — | 2 | 1 |\n\n## O que isto prova\n1. **O e-mail de 09/01/2015 era falso.** O Dr. Nuno Trindade Lourenço escreveu que a sociedade «não tem activo nem passivo». As contas oficiais de 2014, já depois de alteradas pela própria Olha em julho de 2015, mostram em 31/12/2014 um **ativo de 5.829,02 €** (incluindo 2.849,56 € em caixa) e um **passivo de 39.451,26 €**.\n2. **Havia 39.291,45 € de empréstimos dos sócios à empresa (suprimentos).** O anexo da IES classifica esta dívida como «Participantes de capital». Ou seja, a empresa devia este dinheiro aos sócios.\n   - A IES **não diz qual dos sócios** emprestou o dinheiro. Se foi o Serafim, é um **crédito da herança** (75% para os 3 filhos).\n   - Para a empresa fechar «a zeros» em agosto de 2015, esta dívida teve de desaparecer: foi paga, perdoada ou anulada. **Os herdeiros nunca autorizaram de forma expressa o perdão de um crédito do pai.**\n3. **O caixa de 2.849,56 € e os ativos de 1.050,00 € existentes em 31/12/2014** também desapareceram até à dissolução. É preciso saber para onde foram.\n\n## O que isto NÃO prova (para ser honesto)\n- **Não existem camiões nem máquinas de valor nas contas da empresa.** Os ativos fixos nunca passaram de 1.300 €. Se havia viaturas, estavam no nome pessoal do Serafim ou fora da contabilidade. Para verificar isso, serve o pedido de IUC/veículos nas Finanças.\n- **Em dinheiro, o valor a recuperar é pequeno.** A empresa tinha capital próprio negativo e apenas cerca de 5.800 € de ativo. Os suprimentos só valem aquilo que a empresa tinha para pagar.\n- **A versão alterada de 2013 não mostra o que foi mudado.** Só comparando com o depósito original (`Dep. 2325/2014-07-21`) se vê o que foi alterado.\n\n## Próximo passo\nPedir à Conservatória do Registo Comercial:\n- a cópia do `Dep. 2325/2014-07-21` (a versão original das contas de 2013);\n- a cópia do `Dep. 2324/2014-07-21`;\n- a ata de dissolução e liquidação (`Ap. 6/20150812`), para ver o que foi declarado sobre os suprimentos e o saldo de caixa.\n", "driveId": "1zmpNbCMX4GHZZhr3RruSrjTh1owa8CAB", "driveViewUrl": "https://drive.google.com/file/d/1zmpNbCMX4GHZZhr3RruSrjTh1owa8CAB/view", "drivePreviewUrl": "https://drive.google.com/file/d/1zmpNbCMX4GHZZhr3RruSrjTh1owa8CAB/preview"}, {"id": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2025-11-11_Email_Fernando_Palha_Sobe_Proposta_Para_45000_Euros.jpg", "name": "2025-11-11_Email_Fernando_Palha_Sobe_Proposta_Para_45000_Euros.jpg", "title": "Proposta da Contraparte — Email do Dr. Fernando Palha (11/11/2025) a propor 45.000 € de tornas", "relPath": "09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2025-11-11_Email_Fernando_Palha_Sobe_Proposta_Para_45000_Euros.jpg", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2025-11-11_Email_Fernando_Palha_Sobe_Proposta_Para_45000_Euros_TRANSCRICAO.txt", "ext": "jpg", "category": "5. Correspondência & Propostas", "essential": true, "order": 50, "sizeKb": 195.8, "transcriptText": "======================================================================\nDOCUMENTO: Proposta da Contraparte — Email do Dr. Fernando Palha (11/11/2025) a propor 45.000 € de tornas\nCATEGORIA: 5. Correspondência & Propostas\nFICHEIRO ORIGINAL: 09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2025-11-11_Email_Fernando_Palha_Sobe_Proposta_Para_45000_Euros.jpg\n======================================================================\n\n1 de 1\n<\n>\nFernando Palha\n17:00 (há 16 minutos)\n*\nF\npara mim -\n*\nExma. Colega,\nDesde já peço desculpa pela tardança da resposta.\nD\nA minha cliente analisou a V. proposta e mais uma vez sobe para um valor crítico e definitivo de 45.000,00€. Se a Colega achar pertinente apresentar esta proposta aos seus clientes, então\nteremos acordo.\nSem mais de momento, apresento os meus cumprimentos.\nFernando Palha\nAdvogado\n+\n• Responder\n→ Encaminhar\nO Procurar\nC\nIN\n^ 40 11/11/2025", "driveId": "1eV-t7BGJcHYq6yAELdmI7kuMs0AUqfD-", "driveViewUrl": "https://drive.google.com/file/d/1eV-t7BGJcHYq6yAELdmI7kuMs0AUqfD-/view", "drivePreviewUrl": "https://drive.google.com/file/d/1eV-t7BGJcHYq6yAELdmI7kuMs0AUqfD-/preview"}, {"id": "01_Cartas_e_Propostas_Contraparte_Fernando_Palha/2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem.pdf", "name": "2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem.pdf", "title": "Carta da Contraparte — Dr. Fernando Palha (06/06/2025) — Proposta de 41.250 € e Confissão de Dívida de Alimentos", "relPath": "01_Cartas_e_Propostas_Contraparte_Fernando_Palha/2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem.pdf", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem_TRANSCRICAO.txt", "ext": "pdf", "category": "5. Correspondência & Propostas", "essential": true, "order": 51, "sizeKb": 229.1, "transcriptText": "======================================================================\nDOCUMENTO: Carta da Contraparte — Dr. Fernando Palha (06/06/2025) — Proposta de 41.250 € e Confissão de Dívida de Alimentos\nCATEGORIA: 5. Correspondência & Propostas\nFICHEIRO ORIGINAL: 01_Cartas_e_Propostas_Contraparte_Fernando_Palha/2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem.pdf\n======================================================================\n\n--- PÁGINA 1 ---\nASSUNTO: Contraproposta partilha de herança Serafim Bártolo\nherdeiros po\nFernando Palha\nAdvogado\nCP10163L\n2600-123 Vila Franca de Xira\nR. Almirante Cândido dos Reis 95, Lj 3\nIlustre colega Dra. Joana Prioste\nExmas. Sras. Liliana Novo Bártolo Lima,\nMarisa Novo Bártolo e Sr. Ângelo Emanuel Novo\nBártolo\nASSUNTO: Contraproposta partilha de herança Serafim Bártolo\nEm representação da minha constituinte, Olha Bártolo, cônjuge sobreviva de Serafim Bártolo,\nvenho pelo presente expor o seguinte em resposta à carta por V. Exas. enviada e à proposta\napresentada:\n1. Prestação de contas:\na) A minha constituinte não possui comprovativos de rendimentos com hospedagem,\numa vez que a hospedagem no imóvel do Carregado artigo matricial n°726, avaliado\nem 110.000,00€ se fez de maneira temporária e a fim de cobrir as despesas com o\npatrimónio da herança, o que inclui o pagamento ao banco do empréstimo para\nhabitação, do qual ainda não está quitado, ou seja, não foi transferida a titularidade do\nimóvel, e a minha constituinte tem pago sozinha, restando pouco menos de 13.000,00€\na pagar, IMI, obras, despesas com a herança, entre outras despesas relacionadas e\njá referidas anteriormente.\nb) Posto isto, a mesma assume ter fornecido hospedagem no imóvel referido em alguns\nmomentos, mas que os rendimentos do mesmo apenas serviram para cobertura dos\nencargos nos passados anos com a gestão da herança enquanto cabeça-de-casal, e\nnão para proveito pessoal, aceitando que as despesas declaradas sejam excluídas da\nresponsabilidade da massa da herança, cabendo apenas a mesma.\nc) Quanto ao imóvel de Vila Franca de Xira, artigo matricial n° 3483, e avaliado em\n120.000,00€ a minha constituinte enquanto cônjuge sobreviva tem direito a 50% a\ntítulo de meação e ¼ da parte do imóvel do falecido cônjuge, totalizando 62,5%, tendo\no direito de viver na casa de morada de família, até pelo menos a efetivação da\npartilha, não sendo considerada nenhuma compensação aos restantes herdeiros por\neste facto.\n1\n\n--- PÁGINA 2 ---\nAtribuindo assim à massa da herança um valor total de, pelo menos 115.000,00€ + 204.000,00€\ntotalizando 319.000,00€ (Trezentos e dezanove mil euros).\nTendo os dados mencionados em consideração, foi pela minha constituinte elaborada a seguinte\nproposta de partilha e divisão:\n1- Os v./constituintes tem direito a ¼ cada dos 115.000,00€ (metade do valor total) atribuídos\naos imóveis urbanos adquiridos após o matrimónio, cabendo 28.750,00€ a cada parte.\n(86.250,00€);\n2- Os V./Constituintes tem direito a ¼ dos (pelo menos) 204.000,00€ atribuídos aos imóveis\npróprios de Serafim Bártolo, cabendo 51.000,00€ a cada parte. (153.000,00€)\n3- A minha constituinte tem direito a receber do total da massa da herança, 79.750,00€, o\nmesmo total cabe aos V/constituintes, uma vez que a partilha da massa da herança é feita\npor cabeça.\nPropõe-se:\na) Que os V/constituintes fiquem com os 3 imóveis rústicos e/ou de propriedade do falecido,\nque totalizam 204.000,00€ (no mínimo), sem considerar futura alteração dos terrenos para\nurbanos com a nova Lei dos Solos.\nb) Que a minha constituinte fique com os dois imóveis urbanos que totalizam 115.000,00€, e a\ntítulo de tornas atribua a vossos constituintes o valor de 21.000,00€, sendo 7.000,00€ a\ncada um dos V/constituintes herdeiros.\nc) Que a minha constituinte atribua uma compensação a título de atrasos de pensão de\nalimentos devida pelo falecido cônjuge estimadas desde 2003 a 2013, data do falecimento,\nno valor de 20.250,00€, sendo 6.750€ a cada um dos V/constituintes herdeiros.\nd) Desta forma, e face ao expresso anteriormente, minha constituinte ficaria com os dois\nimóveis urbanos citados, pagaria a título de tornas e compensação um total de 13.750,00€\na cada um dos 3 filhos herdeiros de seu falecido cônjuge.\n3- Reconhecimento de Dívidas e Despesas\na) O falecido deixou uma dívida de pensão de alimentos, acumulada durante 10 anos, desde\no divórcio em 2003 e falecimento em 2013, no valor de, pelo menos, 18.000,00€,\nreconhecida, e não integrada na massa da herança, do qual esta a ser tida em consideração\npara compensação dos filhos herdeiros, o valor de 20.250,00€.\n3\n\n--- PÁGINA 3 ---\n2. Partilha e valorização dos bens:\n2.1 Imóveis urbanos em comunhão de adquiridos;\na) O imóvel do Carregado, artigo matricial n° 726, fora avaliado recentemente em 110.000,00€,\npelo que se questiona qual o valor que estão a atribuir ao mesmo e com base em que\navaliação. Será considerado metade do valor como meação da minha constituinte e a outra\nparte, 55.000,00€ para a massa da herança.\nb) O imóvel de Vila Franca de Xira, artigo matricial n° 3483, fora avaliado recentemente em\n120.000,00€, pelo que se questiona novamente qual o valor que estariam a atribuir ao\nmesmo e com base em que avaliação. Será considerado metade do valor como meação da\nminha constituinte e a outra parte, 60.000,00€ para a massa da herança.\nc) Quanto aos dois imóveis urbanos referidos anteriormente, atribuíram na proposta o valor\ntotal de 291.484,00€, sem especificação dos valores de cada bem imóvel, pelo qual\nestimamos que fora 145.742,00€, ou seja, a metade do valor a cada imóvel, estando mais\nde 20.000,00€ acima do valor de avaliação dos mesmos, pelo que solicitamos a\napresentação da vossa avaliação imobiliária, ou redução dos valores apresentados de forma\na se aproximar da avaliação técnica apresentada.\n2.2 Imóveis rústicos e/ou de propriedade própria do de cujus;\na) O imóvel de artigo matricial n° 2574, rústico, fora avaliado anteriormente em\n13.000,00€, e o imóvel de artigo matricial n° 2590, rústico, em 11.000,00€;\ni) Cabe referir a possível valorização imobiliária destes imóveis rústicos, com a recente\nalteração da Lei dos solos, pelo DL. N°117/2024, de 30 de dezembro, que consta\na faculdade de passar os terrenos rústicos á urbanos a fim de criar mais\nhabitações, e com certa facilidade de tramitação, apenas devendo solicitar\naprovação ao Município, assim, valorando os terrenos em torno de mais 50.000\neuros cada, no mínimo, mais-valia que, para efeitos de partilha não estão sendo\nconsiderados.\nb) Referente ao imóvel de artigo matricial n° 2707, urbano (proveniente do artigo matricial\nnº2573 rústico), o valor atribuído não ficou claro, mas considerando os valores referidos\nna alínea a), e o total da proposta, considerou-se que o valor atribuído foi de 63.000,00€,\nvalor pelo qual não se concorda, uma vez que fora avaliado em 195.000,00€, em Maio\nde 2024, e sabemos que, para venda o valor apresentado esta muito abaixo da realidade\nno mercado, assim, solicitamos que seja apresentado um valor mais aproximado a\nrealidade para este imóvel, entre 180.000,00€ (no mínimo) e 195.000,00€, ou que seja\napresentada uma nova avaliação imobiliária especializada.\n\n--- PÁGINA 4 ---\nb) Quanto às despesas dos prédios urbanos: considerando-se o rendimento que nos passados\nanos a minha constituinte tem vindo a obter pelo fornecimento de hospedagem no prédio\nurbano com o artigo matricial n°3483 e que, não tem declarado por razões de não se ter\nobtido comprovativos, nem lucro considerável para a massa da herança, uma vez que, o\nrendimento fora utilizado nas despesas da herança, as despesas totais citadas na proposta\nanterior foram e serão asseguradas pela mesma.\nSolicitamos que V. Exas. aceitem a partilha acima descrita, apresentem a vossa avaliação dos\nimóveis para novo cálculo de partilha ou apresente outra contraproposta justa e fundamentada tendo\nem conta o limite máximo de 41.250,00€ que minha constituinte está disposta a pagar aos\nV./constituintes, até ao dia 30 de junho de 2025.\nCaso tal não seja possível, infelizmente, a minha constituinte ver-se-á adstrita a que seja realizada\na partilha pela via judicial.\nCertos da sua compreensão e ainda na expectativa de uma resolução amigável, aguardamos a sua\nresposta em um prazo razoável.\nVila Franca de Xira, 06 de junho de 2025\nO Advogado\nFerromando haiba Patha\nCed. Prot CH 10163\n2600-123 Vila 5. Xix Tm. 925557 423\n4", "driveId": "1wsioit2koq0S0n0Z-Xikn0F2vy6A1wRx", "driveViewUrl": "https://drive.google.com/file/d/1wsioit2koq0S0n0Z-Xikn0F2vy6A1wRx/view", "drivePreviewUrl": "https://drive.google.com/file/d/1wsioit2koq0S0n0Z-Xikn0F2vy6A1wRx/preview"}, {"id": "01_Cartas_e_Propostas_Contraparte_Fernando_Palha/2024-09-23_Carta_Proposta_Partilha_Fernando_Palha_18000eur.pdf", "name": "2024-09-23_Carta_Proposta_Partilha_Fernando_Palha_18000eur.pdf", "title": "Carta da Contraparte — Dr. Fernando Palha (23/09/2024) — Proposta Inicial de 18.000 €", "relPath": "01_Cartas_e_Propostas_Contraparte_Fernando_Palha/2024-09-23_Carta_Proposta_Partilha_Fernando_Palha_18000eur.pdf", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2024-09-23_Carta_Proposta_Partilha_Fernando_Palha_18000eur_TRANSCRICAO.txt", "ext": "pdf", "category": "5. Correspondência & Propostas", "essential": false, "order": 52, "sizeKb": 6554.9, "transcriptText": "======================================================================\nDOCUMENTO: Carta da Contraparte — Dr. Fernando Palha (23/09/2024) — Proposta Inicial de 18.000 €\nCATEGORIA: 5. Correspondência & Propostas\nFICHEIRO ORIGINAL: 01_Cartas_e_Propostas_Contraparte_Fernando_Palha/2024-09-23_Carta_Proposta_Partilha_Fernando_Palha_18000eur.pdf\n======================================================================\n\n--- PÁGINA 1 ---\nFernando Palha\nADVOGADO\nExmo. Srs.\nÂngelo/Liliana/Marisa Bártolo\nRua dos Conqueiros, s/n\nValado de Santa Quitéria\n2460-207 Alfeizerão\nAssunto: Sucessão/Proposta;\nExmo(a)s. Sr(a)s. e Sra. Dra. Advogada,\nOLHA MAKAROVSKA BÁRTOLO, viúva e cabeça de casal de SERAFIM ANTÓNIO\nMARIA BÁRTOLO, vem agora, apresentar a sua relação de bens, os encargos da herança e\nproposta de partilha. O que faz nos termos e fundamentos seguintes:\nVALOR PATRIMONIAL DOS BENS\nVERBA 1- Prédio urbano, sito na Rua das Conqueiras, 2460-207 Alfeizerão, Alcobaça, Leiria,\ninscrito na matriz sob o n°.2707, com origem no n° 2573, com valor patrimonial tributário (VPT)\nde 37.840,00 euros, conforme certidão permanente e escritura de doação.\nVERBA 2- Prédio rústico, sito em Outeiro-Alcobaça, Leiria, inscrito na matriz sob o nº2590, com\no VPT de 41,98 euros- conforme certidão predial negativa.\nVERBA 3- Prédio Rústico, sito em Outeiro, Alcobaça- Leiria, inscrito na matriz sob o n° 2574,\ncom o VPT de 52,04 euros- conforme certidão predial negativa.\nVERBA 4- Prédio urbano, sito na Praceta Infante D. Henriques, N°49, 4°Esq, Carregado, 2580-\n482, Carregado, inscrito na matriz sob o n° 726, com o VPT de 62841,38 euros- conforme certidão\npredial\nVERBA 5- Prédio urbano, sito na Rua José da Costa Silva, N°72, r/c Dto, 2600-069 Vila Franca\nde Xira, inscrito na matriz sob o nº3483, com o VPT de 41.620,48 euros- conforme certidão\npredial sob o n°4.\nTOTAL DO VALOR DOS BENS: 142.395,88 euros (cento e quarenta e dois mil trezentos e\nnoventa e cinco euros e oitenta e oito cêntimos).\nVALOR DE AVALIAÇÃO DOS BENS\nVERBA 1- Prédio urbano, sito na Rua das Conqueiras, 2460-207 Alfeizerão, Alcobaça, Leiria,\ninscrito na matriz sob o n°.2707, com origem no n° 2573, com valor de avaliação: 195.000 euros,\nem consideração como património de Serafim Bártolo, para partilha apenas 97.500 euros.\nVERBA 2- Prédio rústico, sito em Outeiro-Alcobaça, Leiria, inscrito na matriz sob o nº2590, com\no valor de avaliação :11.000 euros.\nVERBA 3- Prédio Rústico, sito em Outeiro, Alcobaça- Leiria, inscrito na matriz sob o n° 2574,\ncom o valor de avaliação: 13.000 euros.\n\n--- PÁGINA 2 ---\nFernando Palha\nADVOGADO\nVERBA 4- Prédio urbano, sito na Praceta Infante D. Henrique, N°49, 4°esq, Carregado, 2580-\n482, Carregado, inscrito na matriz sob o n° 726, com o valor de avaliação: 110.000 euros, em\nregime de compropriedade em 50% com OLHA BARTOLO.\nVERBA 5- Prédio urbano, sito na Rua José da Costa Silva, N°72, r/c Dio, 2600-069 Vila Franca\nde Xira, inscrito na matriz sob o n°3483, com o valor de avaliação: 120.000 euros, em regime de\ncompropriedade em 50% com OLHA BARTOLO.\nTOTAL DO VALOR DOS BENS: 351.500 euros (trezentos e cinquenta e um mil e quinhentos\neuros).\nCÁLCULO DO PATRIMÓNIO TOTAL DE SERAFIM BARTOLO: (VERBA 1+ VERBA\n2+ VERBA 3+ 50% VERBA 4+ 50% VERBA 5) = 236.500,00€ (Duzentos e trinta e seis mil e\nquinhentos euros)\nRELAÇÃO DE ENCARGOS DA HERANÇA\nAs despesas da Herança que foram suportadas integralmente pela Requerente, Cabeça de casal:\nVERBA 1.\nO Imposto Municipal sobre imóveis (IMI), devido sobre os imóveis identificados na Relação de\nbens, entre 2013 e 2023, no valor global de 3.827,00€\nVERBA 2.\nPrestações do condomínio da verba 3 da Relação de bens, entre 2014 e 2024, no valor global de\n3.710,00 €.\nVERBA 3.\nPrestações vencidas e liquidadas do Crédito Habitação referente a verba 4 da Relação de Bens,\nentre 2014 e 2024, no valor mensal atual de 220,00€ e global de 27.600,00€.\nVERBA 4.\nValor vincendo do crédito habitação, referente á verba 4 dos bens, no valor global de 13.000 euros.\nVERBA 5.\nServiços técnicos que incluem, Advogados, avaliadores, e documentação pós-morte de Serafim\nBártolo, entre outros, no valor global de 5.000,00€.\nVERBA 6.\nDespesas com obras e benfeitorias, referentes as verbas 3 e 4, no valor apurado de 4130,00€.\nVERBA 7.\nOnze coimas liquidadas pela Administração Tributária, no valor global de 417,38€.\nTOTAL DAS DESPESAS JÁ PAGAS PELA CABECÇA-DE-CASAL: 46.124,34€\nTOTAL DOS PASSIVOS: 59.124,34€\nCÁLCULO TOTAL DOS PASSIVOS A CONSIDERAR COMO DE SERAFIM: (50% das\ndespesas das verbas 1,2, 3,4, S e 6, e a totalidade da verba 7) = 29.080,88€.\n• Dos 29.080,00 será reconsiderado apenas o valor de 25.000,00€. (vinte e cinco mil).\nJunto enviamos comprovativos das despesas.\n\n--- PÁGINA 3 ---\nFernando Palha\nADVOGADO\nPROPOSTA DE PARTILHA\n1-A viúva e cabeça de casal, OLHA BARTOLO, fica com:\nVERBA 4: Valor de 120.000,00€ (cento e vinte mil)\n• VERBA S: Valor de 110.000,00€ (cento e dez mil)\nTOTAL: 230.000,00€ (duzentos e trinta mil euros)\nCompropriedade: 115.000,00€ (cento e quinze mil euros)\nMeação: 57.500,00€ (cinquenta e sete mil e quinhentos euros)\nHerdeira de ¼ (quota-parte): 52.875,00€ (cinquenta e dois mil oitocentos e setenta e cinco euros)|\nTornas a pagar: 4.625,00€ (quatro mil seiscentos e vinte cinco euros)\nCom o fim de formalização do acordo de partilha da herança, a mesma propõe o seguinte:\n• Continuar a pagar os 13.000 euros ao Banco, referente ao empréstimo para habitação do\nPrédio Urbano do Carregado;\n• A título de tornas devidas pagar os 4.625,00€ suprarreferidos;\n• Pagar uma compensação no valor de 13.375,00€, aos enteados, a dividir igualmente entre\nas 3 partes.\nTotal a pagar: 18.000 euros.\n2- Aos filhos do de cujus:\nLiliana Novo Bártolo Lima, Ângelo Emanuel Novo Bártolo, Marisa Novo Bártolo, cabem a\npartilha e tornas das seguintes:\n• VERBA 1: 97.500,00€\n• VERBA 2: 11.000,00€\n• VERBA 5: 13.000,00€\nTOTAL ATIVO: 121.500,00\nAcresce ao ativo dos enteados a torna e compensação anteriormente referida de 18.000,00€ euros,\nque será dividida igualmente aos 3 herdeiros, filhos de SERAFIM BÁRTOLO e pago por OLHA\nBARTOLO.\nSolicito, que esta proposta seja apresentada aos herdeiros de Serafim Bártolo, e que, atentem a\nescusa de Olha Bártolo em deduzir todas as despesas por ela suportadas por 10 anos, enquanto\ncabeça de casal, e da mesma, em dar uma compensação, a fim da celeridade da partilha, e\nconsideração aos seus enteados.\nAguardo retorno com aceitação ou contraproposta de partilha.\nVila Franca de Xira, 23 de setembro de 2024\nDr. Feriando Palh\nCF 10163.", "driveId": "1r5JVOYIMAIIbnZT-xRdVS_eC6PtQ3IKZ", "driveViewUrl": "https://drive.google.com/file/d/1r5JVOYIMAIIbnZT-xRdVS_eC6PtQ3IKZ/view", "drivePreviewUrl": "https://drive.google.com/file/d/1r5JVOYIMAIIbnZT-xRdVS_eC6PtQ3IKZ/preview"}, {"id": "02_Cartas_e_Propostas_Herdeiros/2020-02-07_Carta_Angelo_Bartolo_para_Fernando_Palha_Contestacao_Art2707_e_Avaliacao.pdf", "name": "2020-02-07_Carta_Angelo_Bartolo_para_Fernando_Palha_Contestacao_Art2707_e_Avaliacao.pdf", "title": "Carta dos Herdeiros — Resposta de Ângelo Bártolo ao Dr. Fernando Palha (07/02/2020)", "relPath": "02_Cartas_e_Propostas_Herdeiros/2020-02-07_Carta_Angelo_Bartolo_para_Fernando_Palha_Contestacao_Art2707_e_Avaliacao.pdf", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2020-02-07_Carta_Angelo_Bartolo_para_Fernando_Palha_Contestacao_Art2707_e_Avaliacao_TRANSCRICAO.txt", "ext": "pdf", "category": "5. Correspondência & Propostas", "essential": false, "order": 53, "sizeKb": 189.4, "transcriptText": "======================================================================\nDOCUMENTO: Carta dos Herdeiros — Resposta de Ângelo Bártolo ao Dr. Fernando Palha (07/02/2020)\nCATEGORIA: 5. Correspondência & Propostas\nFICHEIRO ORIGINAL: 02_Cartas_e_Propostas_Herdeiros/2020-02-07_Carta_Angelo_Bartolo_para_Fernando_Palha_Contestacao_Art2707_e_Avaliacao.pdf\n======================================================================\n\n--- PÁGINA 1 ---\nScanned with CamScanner\nLisboa, 7 de fevereiro de 2020\nExmo. Senhor,\nFernando Ferreira Palha,\nTambém em nome das minhas irmãs, Liliana Novo Bártolo Lima e Marisa Novo Bártolo,\nacuso a receção da sua carta e respectivo anexo com a avaliação que realizaram dos bens\nimóveis do nosso pai, Serafim António Maria Bártolo.\nSobre a carta e o anexo, surgiu-nos a dúvida relativamente à moradia da Rua das\nConqueiras, com o artigo n.° 2707, pois este prédio urbano não consta da lista de bens\nimóveis a ser transmitidos, emitida pelas Finanças. Mais ainda, o item com o artigo n.° 2573,\nnão foi avaliado, sendo que este corresponde ao terreno rústico por si indicado como o lote\nn.º 1 nas cartas anteriores.\nAproveito para informar que tomámos as diligências necessárias para prosseguir com a\npartilha da herança, ao contratarmos uma empresa para a avaliação dos prédios urbanos e\nrústicos. Para proceder à conclusão da avaliação, o avaliador necessita aceder aos\napartamentos de Vila Franca de Xira e do Carregado, em data a combinar, com a maior\nbrevidade possível. Para o efeito, agradeço antecipadamente que me contacte por via\ntelefónica ou por e-mail (angelo.nbartolo@gmail.com).\nPor fim, solicito que cópia da correspondência relativa ao processo da partilha da herança\nseja também para mim remetida, para a minha residência fiscal sita na Rua Ribeiro\nSanches, n.° 5, R/C, 1200-786 Lisboa, ou para o meu e-mail.\nGrato pela atenção,\nOs meus cumprimentos,\nÂngelo Emanuel Novo Bártolo\nAgdo Emarel Nos jital\nScanned with CamScanner", "driveId": "1Mdpg7kRSLQGiH7CEbxjnIN1Sdj2-Snax", "driveViewUrl": "https://drive.google.com/file/d/1Mdpg7kRSLQGiH7CEbxjnIN1Sdj2-Snax/view", "drivePreviewUrl": "https://drive.google.com/file/d/1Mdpg7kRSLQGiH7CEbxjnIN1Sdj2-Snax/preview"}, {"id": "02_Cartas_e_Propostas_Herdeiros/2025-07_Carta_Dra_Joana_Prioste_Proposta_75000eur_Contestacao_Art2707_e_Valorizacao.txt", "name": "2025-07_Carta_Dra_Joana_Prioste_Proposta_75000eur_Contestacao_Art2707_e_Valorizacao.txt", "title": "Minuta de Resposta — Dra. Joana Prioste (Julho 2025) — Contraproposta de 75.000 €", "relPath": "02_Cartas_e_Propostas_Herdeiros/2025-07_Carta_Dra_Joana_Prioste_Proposta_75000eur_Contestacao_Art2707_e_Valorizacao.txt", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2025-07_Carta_Dra_Joana_Prioste_Proposta_75000eur_Contestacao_Art2707_e_Valorizacao_TRANSCRICAO.txt", "ext": "txt", "category": "5. Correspondência & Propostas", "essential": false, "order": 54, "sizeKb": 5.2, "transcriptText": "======================================================================\nDOCUMENTO: Minuta de Resposta — Dra. Joana Prioste (Julho 2025) — Contraproposta de 75.000 €\nCATEGORIA: 5. Correspondência & Propostas\nFICHEIRO ORIGINAL: 02_Cartas_e_Propostas_Herdeiros/2025-07_Carta_Dra_Joana_Prioste_Proposta_75000eur_Contestacao_Art2707_e_Valorizacao.txt\n======================================================================\n\nTitle: Live Content\n\nDescription: Fetched live\n\nSource: https://docs.google.com/document/d/10SALJLeUrLFdZnvL68GM3AgsLVdNApJNVRS9rDcG0YM/export?format=txt\n\n---\n\n﻿Ilustre Colega,\nDepois de atenta análise e ponderação da sua proposta, há alguns pontos que carecem de esclarecimento:\n1. Prestação de contas\nAs informações prestadas são manifestamente insuficientes, não concretizando o valor auferido pelas rendas (embora, em comunicações anteriores, tenha já manifestado a intenção de imputar essa despesa aos meus clientes, apesar de, aparentemente, a mesma estar a ser liquidada com base num rendimento da herança).\n\nRecorda-se que, nos termos do artigo 2088.º do Código Civil, o cabeça-de-casal tem o dever legal de prestar contas da administração da herança.\nPelo que, cordialmente, solicitamos uma prestação de contas completa e esclarecedora, sob pena de avançarmos pela via judicial.\nNota: O artigo 2088.º do Código Civil impõe ao cabeça-de-casal a obrigação de apresentar contas detalhadas a todos os herdeiros, especialmente quanto aos rendimentos gerados por bens da herança, como imóveis arrendados.\n2. Quanto ao imóvel sito no Valado de Santa Quitéria:\nA proposta apresentada incorre num pequeno lapso ao considerar, desde logo, a entrada do mesmo para a massa da herança. No entanto, mesmo que se entendesse a entrada deste, então nunca seria a 100%, como foi considerado pela V. Cliente, mas apenas a 50%, uma vez que a outra metade sempre seria bem própria da mãe dos meus clientes.\nTal é compatível com o disposto no artigo 1721.º do Código Civil, relativo aos bens próprios não comunicáveis por efeito do regime matrimonial.\n\nA esta questão acresce o facto de o valor em que se avalia o imóvel se encontrar amplamente inflacionado, atendendo ao facto de que se trata de um prédio que não se encontra integralmente registado.\n\nRecorda-se que, nos termos do artigo 7.º do Código do Registo Predial, a inexistência de registo da construção limita o valor legalmente atribuível ao bem.\nAdemais, os prédios rústicos sitos no Valado de Santa Quitéria, os quais, segundo informação prestavelmente fornecida pelo Il. Colega, são suscetíveis de beneficiar do regime jurídico da Nova Lei dos Solos, encontram-se avaliados num valor manifestamente excessivo. No entanto, se assim entender considerar, então é vontade dos meus clientes que seja a massa da herança — a qual beneficiará da valorização dos terrenos — a diligenciar pela legalização dos mesmos.\n\nNos termos do artigo 2079.º do Código Civil, tal diligência compete à administração da herança.\nNota: O artigo 1721.º protege os bens próprios da comunhão; o artigo 7.º do Código do Registo Predial limita o valor de imóveis sem registo; e o artigo 2079.º responsabiliza o cabeça-de-casal por atos de administração da herança, como a legalização de bens.\n3. Quanto aos imóveis sitos em Vila Franca de Xira e no Carregado:\nÉ de pacífico entendimento que os mesmos sejam considerados apenas pela metade para a integração da massa da herança.\n\nContudo, carecem de nova avaliação da parte da V. Cliente, uma vez que o valor se encontra desajustado da realidade envolvente, como se depreende de uma breve pesquisa.\nVila Franca de Xira registou uma valorização de aproximadamente 49% entre 2021 e 2025, passando de cerca de 1.630 €/m² para 2.425 €/m², segundo dados oficiais, do Idealista, Casa Sapo e anúncios recentes na própria zona de Povos.\n\nCarregado, inserido na freguesia urbana de Alenquer, registou um crescimento semelhante, com uma valorização total estimada em 48% no mesmo período, passando de 1.350 €/m² em 2021 para 2.000 €/m² em 2025, conforme dados oficiais, do Idealista, Imovirtual e Supercasa.\nTais dados sustentam o pedido de atualização, nos termos do artigo 2101.º, n.º 2 do Código Civil, que exige que se atenda ao valor real dos bens à data da partilha.\nNota: O artigo 2101.º, n.º 2, do Código Civil estabelece que os bens devem ser avaliados pelo seu valor real no momento da partilha. A valorização de cerca de 50% nos imóveis desde 2021 justifica plenamente a nova avaliação.\n4. Proposta de partilha\nOs meus clientes estão, contudo, dispostos a aceitar ficar com a casa e com os prédios rústicos sitos no Valado de Santa Quitéria, conquanto que lhes sejam pagas tornas no valor de 75.000,00 € (25.000,00 € a cada um dos meus clientes).\nNos termos do artigo 2114.º do Código Civil, as tornas devem assegurar o equilíbrio e a igualdade entre os herdeiros.\nNota: O artigo 2114.º do Código Civil visa garantir que nenhum herdeiro seja prejudicado na atribuição dos bens da herança, sendo as tornas o meio legal para compensar desigualdades.\nAgradecemos a resposta até ao fim do mês de julho, para que possamos diligenciar pelo agendamento das partilhas nos termos acordados. Reservam-se, contudo, os meus clientes no direito de agir pelos meios judiciais adequados por forma a ver concretizados e satisfeitos os seus direitos enquanto herdeiros — mas também enquanto filhos que há muito têm sido prejudicados e sujeitos a condições precárias por negligência do de cujus.\nA Colega ao dispor,\nJoana dos Santos Prioste\n\n", "driveId": "1tRVJQEQC-AQWml8WmpYvO_Bi0ygXGkYA", "driveViewUrl": "https://drive.google.com/file/d/1tRVJQEQC-AQWml8WmpYvO_Bi0ygXGkYA/view", "drivePreviewUrl": "https://drive.google.com/file/d/1tRVJQEQC-AQWml8WmpYvO_Bi0ygXGkYA/preview"}, {"id": "05_Provas_Despesas_Contas_e_Fuga_Email_BricoGest/2024-08_Comprovativos_Despesas_Olha_Com_Email_Interno_BricoGest_IMI_Seguro_BCP.pdf", "name": "2024-08_Comprovativos_Despesas_Olha_Com_Email_Interno_BricoGest_IMI_Seguro_BCP.pdf", "title": "Relação de Despesas Apresentada por Olha Bártolo (IMI, Seguros e Email Interno BricoGest — Agosto 2024)", "relPath": "05_Provas_Despesas_Contas_e_Fuga_Email_BricoGest/2024-08_Comprovativos_Despesas_Olha_Com_Email_Interno_BricoGest_IMI_Seguro_BCP.pdf", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2024-08_Comprovativos_Despesas_Olha_Com_Email_Interno_BricoGest_IMI_Seguro_BCP_TRANSCRICAO.txt", "ext": "pdf", "category": "5. Correspondência & Propostas", "essential": false, "order": 55, "sizeKb": 510.1, "transcriptText": "======================================================================\nDOCUMENTO: Relação de Despesas Apresentada por Olha Bártolo (IMI, Seg a Quitéria\n2460-207 Alfeizerão\nProcesso: 1476/07.0TBACB\nIncumprimento do Poder Paternal\nN/Referência: 2203029\nData: 15-10-2008\nRequerente: Graciete da Conceição Novo Bártolo\nRequerido: Seratim António Maria Bartolo\nAssunto: Notificação\nFica deste modo V. Ex* notificado, relativamente ao processo supra identificado, para no\nprazo de 10 dias vir aos autos indicar qual a ctual morada do requerido.\n\n--- PÁGINA 3 ---\nR\nR13340***\nExmo(a). Senhor(a)\nDr(a). Lucinda Moniz Pereira\nRua da Feira N°. 20 - 1°. Andar\n2500-137 Caldas da Rainha\nProcesso: 1453/07.1TBACB\nProcedimento Cautelar - Alimentos\nN/Referência: 2085020\nProvisórios\nData: 05-06-2008\nRequerente: Liliana Novo Bartolo\nRequerido: Serafim António Maria Bartolo\nAssunto: Notificação de Custas\nTendo sido deferido o pagamento das custas em prestações, fica notificado, na qualidade\nMandatário, relativamente ao processo supra identificado, para efectuar o pagamento da prest\nsinalada no Mapa com um X, no prazo indicado na guia de liquidação anexa.\nMAPA DE PRESTAÇÕES:\nMês de pa\n\n--- PÁGINA 4 ---\nDECLARAÇÃO\nGRACIETE CONCEIÇÃO NOVO, progenitora de Liliana Novo Bártolo, esta última com 21\nanos e estudante Universitária, tem a seu cargo mais dois filhos menores.\nEm sentença judicial no âmbito de Regulação do Poder Paternal, Proc® n° 28 da Conservatória\ndo Registo Civil de Alcobaça, ficou estipulado que o progenitor, Serafim António Maria\nBártolo, tinha obrigação de prestar alimentos aos filhos no valor de 225€ mensais, alem de\ncontribuir nas despesas de saúde e educação, sendo estas divididas equitativamente pelos dois\nprogenitores.\nContudo, tais obrigações não têm sido cumpridas pelo progenitor, sendo que, em relação à\npensão de alimentos verifica-se um atraso de 2 anos, e no que respeita às despesas de saúde e\neducação aquele não contribui há cerca de 4 anos.\nDeste modo e, tendo em conta a desproporção entre ganhos e despesas do agregado familiar, é\ncom elevadas dificuldades que a própria procura colmatar as necessidades dos filhos, em\nespecial a nível educativo, pelo que se solicita, que seja atribuída a Liliana Bártolo, Bolsa de\nEstudo.\nAgradecendo desde já a atenção dispensada. Pede deferimento,\nCaldas da Rainha, 10 de Novembro de 2006\nSpacete de Encos Noe\nGraciete da Conceição Novo\n\n--- PÁGINA 5 ---\nSEGURANÇA SOCIAL\nCENTRO DISTRITAL DE SEGURANÇA SOCIAL DE LERIA\nINSTITUTO DA SEGURANÇA SOCIAL, I.P.\nProtecção Juridica\nProcesso n.° 3851/06 PJ-AM\nDEFERIMENTO\nGraciete Conceição Novo, NIF 180774450, residente em Rua Conqueiras, Valado Sta Quitéria,\n2460-207 Alfeizerão, veio, ao abrigo da Lei n.° 34/2004, de 29/07, requerer concessão de Protecção\nJurídica, para Apoio Judiciário, na(s) modalidade(s) de:\nDispensa de taxa de justiça e demais encargos com o processo\nO requerimento deu entrada neste Centro Distrital de Segurança Social de Leiria em: 14/08/2006.\nO pedido destina-se a: instaurar acção judicial de alimentos.\nDos Factos:\nEm 25/08/2006, nos termos das disposições conjugadas dos artigos 23.° da Lei n.° 34/2004, de 29/07,\ne 100.° e 101.° do Código do Procedimento Administrativo, realizou-se Audiência de Interessados,\natravés da qual se manifestou a intenção de indeferir o pedido, porquanto:\nI. Não foram juntos todos os elementos necessários à avaliação da situação económica do/a\n5.º da Portaria 1085-A/2004, de 31/08.\nrequerente e demais pessoas que consigo vivem em economia comum, de acordo com os artigos 3.°, 4° e\nFoi solicitada a apresentação dos documentos/esclarecimentos em causa. No entanto,\nl. Numa primeira análise, feita a apreciação da situação económica do/a requerente e demais pessoas\nque consigo vivem em economia comum, ao abrigo dos artigos 6.° a 10.° da mesma Portaria, apurou-se um\nrendimento relevante para efeitos de protecção jurídica superior a metade e igual ou menor do que\nduas vezes o valor do salário mínimo nacional (superior ao previsto na al a ) e b) do Anexo I, à Lei de\nProtecção jurídic CAO_ORDENADO_TRANSCRICAO.txt", "ext": "md", "category": "7. Pareceres & Guias Processuais", "essential": true, "order": 70, "sizeKb": 16.6, "transcriptText": "======================================================================\nDOCUMENTO: Síntese Geral do Processo e Plano de Ação Ordenado (2026)\nCATEGORIA: 7. Pareceres & Guias Processuais\nFICHEIRO ORIGINAL: 00_RESUMO_GERAL_DESCOBERTAS_E_PLANO_DE_ACAO_ORDENADO.md\n======================================================================\n\n# RESUMO GERAL DE TODAS AS DESCOBERTAS E PLANO DE AÇÃO ORDENADO\n**Processo:** Herança de Serafim António Maria Bártolo (`NIF Falecido: 112309178` | `NIF Herança: 741030756` | Óbito: `31/12/2013`)\n**Herdeiros Legitimários (Filhos):**\n1. **Liliana Novo Bártolo Lima** (`NIF 237162970`)\n2. **Marisa Novo Bártolo** (`NIF 270883193`)\n3. **Ângelo Emanuel Novo Bártolo** (`NIF 270883215`)\n**Comproprietária de `50%` da Casa de Alcobaça (Ex-Cônjuge):** **Graciete da Conceição Novo** (`NIF 180774450`)\n**Cabeça-de-Casal (Viúva, casada em separação de bens em 2005):** **Olha Makarovska Bártolo / Olha Tsebrynska** (`NIF 235492639`)\n\n---\n\n## PARTE I — TUDO O QUE DESCOBRIMOS (AS 6 GRANDES FRENTES DE PROVA)\n\n### 1. A Casa e o Terreno da Mãe em Alcobaça (`Art. Rústico 2573` + `Art. Urbano 2707`) — O Fim do Bluff dos `195.000,00 €`\nO advogado da Olha (**Dr. Fernando Ferreira Palha**) tentou descontar às vossas tornas **`48.750,00 €`** alegando que a casa da vossa mãe valia **`195.000,00 €`** e que a Olha tinha direito a **`25%` (`1/4`)** da totalidade. **Descobrimos 4 provas documentais que destroem esta tese:**\n1. **A Escritura de Doação de `22/10/1985`** ([Pag1](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/1985-10-22_Escritura_Doacao_Art_2573_Filho_e_Nora_Pag1.jpg), [Pag2](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/1985-10-22_Escritura_Doacao_Art_2573_Filho_e_Nora_Pag2.jpg), [Pag3](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/1985-10-22_Escritura_Doacao_Art_2573_Filho_e_Nora_Pag3_Assinaturas.jpg)): O avô António Bártolo doou os `1.300 m²` do `Art. 2573` em conjunto a **«seus filho e nora»** (Serafim e Graciete). Logo, **`50%` já pertencem à vossa mãe (Graciete)** e nunca entraram na herança!\n2. **A Certidão Permanente da Conservatória do Registo Predial de Alcobaça — Descrição n.º `506/19880805`** ([CRP 506](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2024-04-23_Certidao_Permanente_CRP_Alcobaca_506_Art_2573_Serafim_e_Graciete.jpg)): Os `1.300 m²` estão registados em nome de **Serafim Bártolo E Graciete Novo** desde `05/08/1988` (`Ap. 10`).\n3. **O Acordo de Casa de Morada de Família no Divórcio de `22/05/2002`** ([Acordo 2002](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2002-05-22_Acordo_Destino_Casa_Morada_Familia_Art_2707.jpg)): Assinado pelo pai e pela mãe, declara expressamente que o `Art. Urbano 2707` é **«propriedade em comum de Graciete da Conceição Novo Bártolo e marido Serafim António Maria Bártolo»**.\n   - **Consequência matemática:** A quota da Olha na casa da mãe (`Art. 2707`) e no terreno (`Art. 2573`) é de apenas **`1/8` (`12,5%`)**, e **NUNCA `25%`**! E a declaração da Olha no Imposto do Selo de 2014 (onde declarou `1/1`) é falsa.\n4. **A Contradição de `6,5x` do Próprio Perito da Olha (Eng.º Henrique Ponce Dentinho):**\n   - No **1.º Relatório de `30/12/2019`** ([Relatório 2019](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/08_Novas_Provas_Pasta_EXTRA_Organizadas/03_Relatorio_Pericial_2019_Eng_Henrique_Dentinho_1a_Versao/2019-12-30_Relatorio_Perito_Olha_Pag4_Avalia_Casa_Mae_Em_Apenas_30000_Euros.jpg)), o próprio perito contratado pela Olha avaliou a casa da mãe em apenas **`30.000,00 €`** (`20.000 €` terreno + `10.000 €` casa com `90%` de depreciação, escrevendo que o 1.º andar em tijolo **tem de ser demolido**!).\n   - Em **Abril de 2024**, o mesmo perito inflacionou a mesma casa em **650%** para **`195.000,00 €`**!\n   - Aplicando `12,5%` aos `30.000,00 €` que o próprio perito da Olha certificou em 2019, a parte da Olha na casa da mãe vale **`3.750,00 €`** (e não `48.750,00 €`), ao qual ainda se abatem as **benfeitorias/obras pagas pela mãe desde 2002**!\n\n---\n\n### 2. Os Dois Apartamentos (`Vila Franca de Xira` e `Carregado`) e as Rendas Ocultadas\n1. **Valor Real de Mercado (2026):**\n   - **T3 Vila Franca de Xira (`Art. 2354 - R/C Esq.`):** Avaliado pela ERA em 2024 em `145.000 €`, vale hoje em 2026 cerca de **`170.000 € a 180.000 €`** (quota de `100%` da herança; `75%` dos 3 filhos = **`127.500 € a 135.000 €`**).\n   - **T2 Carregado (`Art. 2219 - 3.º Dto.`):** Avaliado pela ERA em 2024 em `154.000 €`, vale hoje em 2026 cerca de **`180.000 € a 190.000 €`** (`50%` já é da Olha; `50%` é da herança; `37,5%` dos 3 filhos = **`67.500 € a 71.250 €`**).\n2. **Rendas Ocultadas do Apartamento do Carregado (2014–2026):**\n   - A Olha habita em exclusivo o apartamento de Vila Franca de Xira e tem **arrendado clandestinamente o apartamento do Carregado há mais de 12 anos** sem prestar contas (comprovado pelo testemunho da vizinha nos vídeos).\n   - **37,5% das rendas de 12 anos** pertencem aos 3 filhos (**`+28.800,00 € a +34.650,00 €`** a exigir na Prestação de Contas).\n\n---\n\n### 3. A Bomba do Seguro de Vida do Crédito Habitação (`Emails de 09/01/2015 e 03/03/2015`)\n- Nos emails do 1.º advogado da Olha (**Dr. Nuno Trindade Lourenço**, [09/01/2015](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_09Jan2015_Dissolucao_Empresa_e_Seguradora.png) e [03/03/2015](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/Email_Advogado_Nuno_Trindade_Lourenco_03Mar2015_Urgencia_Dissolver_Empresa_e_Seguradora.png)), ele confessa por escrito que existia um **processo com a Seguradora do Seguro de Vida do empréstimo bancário da casa** (*«processo com a seguradora (a qual ainda não decidiu sobre o pagamento ou não do empréstimo contraído pelo V. pai para aquisição de imóvel)»* e *«A situação da casa encontra-se a aguardar decisão final da seguradora»*).\n- Isto explica por que razão o atual advogado da Olha (Dr. Fernando Palha), depois de em `29/10/2019` tentar cobrar-vos uma suposta dívida ao banco de `27.500,00 €`, **apagou completamente qualquer dívida bancária nas cartas de Abril de 2024 e Junho de 2025**!\n\n---\n\n### 4. A Empresa de Sucatas (`Safarimedieval, Lda.`, `NIPC 509474110`) — A Sentença de `38.500 €` e a Alteração Retroativa das Contas em Julho de 2015\n1. **A Sentença de `08/01/2015` ([Proc. 2414/14.0TBVFX](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2015-01-08_Sentenca_Tribunal_VFX_Proc_2414_14_Anula_Coima_38500eur_Safarimedieval.pdf)):**\n   - O Tribunal de Vila Franca de Xira **anulou a coima ambiental de `38.500,00 €`** da CCDR-LVT, mas mandou devolver o processo à CCDR-LVT.\n   - No email de `03/03/2015`, o Dr. Nuno Trindade Lourenço admitiu que queriam dissolver a empresa o mais depressa possível para evitar que a CCDR-LVT voltasse a atacar a empresa.\n2. **A Manobra Contabilística de `18 e 20 de Julho de 2015` ([Publicações Oficiais MJ](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/PUBLICACOES_OFICIAIS_SAFARIMEDIEVAL_509474110_PORTAL_DA_JUSTICA.md)):**\n   - Em `09/01/2015`, o advogado disse-vos que a empresa *\"não tem ativo nem passivo\"* para assinarem a ata de dissolução (datada de `30/06/2015`).\n   - Porém, descobrimos no Portal da Justiça que **nos dias `18/07/2015` (`Dep 2090/2015-07-18`) e `20/07/2015` (`Dep 2258/2015-07-20`) — já depois da ata de 30 de junho de 2015 e 3 semanas antes de registarem a dissolução a `12/08/2015` — a Olha foi submeter duas «ATUALIZAÇÕES DE PRESTAÇÃO DE CONTAS» para alterar retroativamente o Balanço de 2014 e o Balanço de 2013 (do ano em que o vosso pai morreu)**!\n   - **Regra Jurídica (Art. 154.º do Código das Sociedades Comerciais — *Ativo Superveniente*):** Mesmo tendo os filhos assinado a dissolução da empresa em 2015, **qualquer bem, camião, máquina, saldo bancário ou crédito de sócio (suprimento) que existisse à data da morte do pai e tenha sido ocultado nas contas pertence por lei aos sócios/herdeiros (`75%` da quota de `4.000 €` do pai é dos 3 filhos = `60%` de toda a empresa!)**.\n\n---\n\n### 5. Os Processos de Pensão de Alimentos em Alcobaça (`Proc. 28`, `Proc. 1476/07.0TBACB` e `Proc. 1453/07.1TBACB`)\n- Provam que o pai tinha uma obrigação judicial de pagar **`225,00 €/mês`** + `50%` das despesas de saúde/educação e que foi proferida **Sentença de Incumprimento em Outubro de 2008** ([Notificação de Sentença](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2008_Tribunal_Alcobaca_Proc_1476_07_0TBACB_Notificacao_Sentenca.jpg)).\n- Além do crédito de alimentos (especialmente da Marisa, que era menor até `13/12/2014`, pelo que a prescrição não corria contra ela nos termos do Art. 320.º do CC), estas decisões provam que **a mãe suportou sozinha a 100% os encargos da casa e dos 3 filhos desde 2002**.\n\n---\n\n### 6. A Evolução das Propostas da Olha (O Pânico de Ir para Tribunal)\n- **Outubro 2019:** Oferecia **`16.406,25 €`** aos 3 filhos (`5.468 €` cada).\n- **Abril 2024:** Oferecia **`18.375,00 €`** aos 3 filhos (`6.125 €` cada).\n- **Junho 2025:** Subiu para **`30.000,00 €`** aos 3 filhos (`10.000 €` cada).\n- **11 de Novembro de 2025 ([Email Dr. Fernando Palha](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2025-11-11_Email_Fernando_Palha_Sobe_Proposta_Para_45000_Euros.jpg)):** Subiu para **`45.000,00 €`** (`15.000 €` cada + vocês ficarem com a casa da mãe e terrenos rústicos).\n- **Quanto vale na realidade o vosso quinhão justo (sem o bluff da casa da mãe, com valores de 2026 e com as rendas do Carregado)?**\n  - Só nos imóveis urbanos (sem contar com as rendas ocultadas nem com a empresa), tirando o desconto falso de `48.750 €` da casa da mãe, as tornas justas dos 3 filhos situam-se entre **`85.000,00 € e 115.000,00 €`** (e com as rendas ocultadas do Carregado ultrapassam os **`115.000,00 € a 140.000,00 €`**)!\n\n---\n\n## PARTE II — TUDO O QUE DEVES FAZER E EM QUE ORDEM EXATA\n\n### PASSO 1 (HOJE / ONLINE — CUSTO: `0,00 €` A `9,00 €`): Recolher os Dados Fiscais e das Contas da Empresa\n1. **No Portal das Finanças (`e-Balcão` — Custo: `0,00 €`):**\n   - Envia o pedido que te deixei pronto, anexando o PDF da **Habilitação de Herdeiros n.º 2280/2014** ([2014-03-24_Habilitacao_Herdeiros_Proc_2280_2014_Alenquer.pdf](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2014-03-24_Habilitacao_Herdeiros_Proc_2280_2014_Alenquer.pdf)), a pedir:\n     - A **relação de veículos (IUC)** que estavam em nome do teu pai (`NIF 112309178`) e da empresa (`NIPC 509474110`) em `31/12/2013`;\n     - A **1.ª Declaração IES de 2013** (entregue em julho de 2014) e a **IES de substituição de 2013** (entregue em julho de 2015).\n2. **No Portal Oficial da Empresa (`https://www2.gov.pt/CVE/IES/ElaborarPedido.aspx` — Custo: `9,00 €` pelos 3 anos) OU por Email para a Conservatória (`crcpn.alenquer@irn.mj.pt`):**\n   - Podes pedir a **Certidão Oficial de Contas Anuais** dos 3 anos (`2012, 2013 e 2014`) por **`9,00 €`** no site do Estado (que traz a IES oficial completa e o nome do Contabilista Certificado);\n   - **E** enviar email para a **Conservatória do Registo Comercial de Alenquer (`crcpn.alenquer@irn.mj.pt`)** a pedir cópia/certidão específica do **`Depósito n.º 2325/2014-07-21`** (a 1.ª entrega das contas de 2013 antes de a Olha a alterar) e da **`Apresentação Ap. 6/20150812`** (a ata de dissolução de `30/06/2015`).\n3. **No teu Gmail (`angelo.nbartolo@gmail.com` — Custo: `0,00 €`):**\n   - Pesquisa por **`ntrindadel`** (onde vimos que tens `50` resultados) ou por **`acta`** / **`seguradora`** para veres se tens mais algum email de 2015 com a ata que assinaram ou com a resposta da Seguradora do crédito habitação.\n\n---\n\n### PASSO 2 (ESTA SEMANA — GRATUITO COM A HABILITAÇÃO DE HERDEIROS): Banco de Portugal e Tribunal de Alcobaça\n1. **No Banco de Portugal (Custo: `0,00 €`):**\n   - Com o teu **Cartão de Cidadão** e o PDF da **Habilitação de Herdeiros n.º 2280/2014** ([2014-03-24_Habilitacao_Herdeiros_Proc_2280_2014_Alenquer.pdf](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/09_Provas_Pasta_EXTRA_II_Escritura_CRP_Divorcio_e_Alimentos/2014-03-24_Habilitacao_Herdeiros_Proc_2280_2014_Alenquer.pdf)), pede como herdeiro de titular falecido:\n     - O **Mapa da Base de Dados de Contas Bancárias** do teu pai (`NIF 112309178`) e da `Safarimedieval, Lda.` (`NIPC 509474110`) à data de `31/12/2013` e datas de encerramento;\n     - O **Mapa da Central de Responsabilidades de Crédito (CRC)** do teu pai (`NIF 112309178`) em `dezembro de 2013` e evolução até hoje (para veres qual era o banco do empréstimo da casa e quando é que a Seguradora pagou o empréstimo!).\n2. **No Tribunal de Alcobaça (sobre o processo de Alimentos que \"não encontram\"):**\n   - Não peças pelo nome! Entrega na Secretaria os **3 números exatos de processo** que descobrimos nas notificações da pasta `EXTRA II`:\n     - **Processo n.º `1476/07.0TBACB`** (ex-1.º Juízo — Incumprimento do Poder Paternal, com **Sentença de Outubro de 2008**);\n     - **Processo n.º `1453/07.1TBACB`** (ex-2.º Juízo — Alimentos Provisórios da Liliana);\n     - **Processo n.º `28` (de 2002/2006)** da Conservatória do Registo Civil de Alcobaça.\n\n---\n\n### PASSO 3 (JUNTO DA SEGURANÇA SOCIAL — SE QUISEREM IR PARA TRIBunal SEM CUSTAS): Apoio Judiciário\n- Se não houver acordo e tiverem de avançar para o **Processo de Inventário Judicial**, tu, a Liliana, a Marisa e a tua mãe podem entregar o requerimento de **Proteção Jurídica / Apoio Judiciário (Mod. PJ 1 - DGSS)** na Segurança Social (tens o guia completo passo a passo na pasta [07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao](file:///Users/angelobartolo/Documents/PROCESSO_HERANCA_SERAFIM_BARTOLO/07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao/02_GUIA_PASSO_A_PASSO_APOIO_JUDICIARIO_SEGURANCA_SOCIAL.md)) para ficarem isentos de taxas de justiça e custos de peritos do Tribunal.\n\n---\n\n### PASSO 4 (CONFRONTO FINAL ATRAVÉS DA ADVOGADA OU ENTRADA DO INVENTÁRIO JUDICIAL):\nEntregar à vossa advogada (Dra. Joana Prioste, ou ao advogado que escolherem) a pasta completa **`PROCESSO_HERANCA_SERAFIM_BARTOLO`** com estas provas para enviar a **Contra-Proposta Final / Ultimato Pré-Judicial** ao Dr. Fernando Ferreira Palha:\n1. **Confrontar o Dr. Fernando Palha com as 3 provas irrefutáveis da casa da mãe:**\n   - Escritura de Doação de `22/10/1985` (`50%` da mãe Graciete) + Certidão Predial `506/19880805` + Acordo de Divórcio de `22/05/2002` $\\rightarrow$ **A quota da Olha é `12,5%` (`1/8`), e não `25%`!**\n   - E confrontá-lo com o **Relatório de `30/12/2019` do próprio perito dele (Eng.º Henrique Dentinho)** que avaliou a casa da mãe em **`30.000,00 €`** (`12,5% = 3.750,00 €`, antes de abater as obras pagas pela mãe desde 2002!).\n2. **Confrontá-lo com os 4 factos que serão requeridos no Inventário Judicial se não houver acordo:**\n   - **Rendas ocultadas do Carregado desde 2014** (of

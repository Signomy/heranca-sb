1.250,00 €` (`13.750,00 €` a cada filho), **onde o advogado confessa por escrito a dívida de alimentos de `18.000,00 €–20.250,00 €` e o arrendamento/hospedagem clandestina e não declarada às Finanças nos dois imóveis urbanos (Art. 726 e Art. 3483)**.\n2. **`02_Cartas_e_Propostas_Herdeiros/`**\n   - `2019-08-30_Minuta_Acordo_Partilhas_2019.docx`: Primeira minuta de 2019 (onde o Art. 2707 urbano nem constava da certidão das Finanças da herança de Serafim).\n   - `2020-02-07_Carta_Angelo_Bartolo_para_Fernando_Palha_Contestacao_Art2707_e_Avaliacao.pdf`: Carta assinada por Ângelo Bártolo (07/02/2020) a denunciar que o Art. 2707 não constava da lista de bens a transmitir nas Finanças e a exigir acesso aos apartamentos de VFX e Carregado para avaliação.\n   - `2023-07_Carta_Resposta_Dr_Francisco_Tomas_Amaral.txt`: Carta de resposta de julho de 2023 (Dr. Francisco Tomás Amaral) a impugnar a avaliação unilateral e a exigir prestação de contas das rendas e das contas bancárias desde 2014.\n   - `2025-01-27_Carta_Dra_Joana_Prioste_Proposta_96000eur_e_Prestacao_Contas.docx`: Carta da Dra. Joana Prioste (27/01/2025) a intimar para prestação de contas em 15 dias úteis (Art. 2089.º CC) e a propor `96.000,00 €` de tornas (`32.000,00 €` por filho) + venda partilhada do Art. 2573, excluindo os `22.000,00 €` de pensão de alimentos.\n   - `2025-02-14_Carta_Dra_Joana_Prioste_Proposta_87556eur_e_Prestacao_Contas.docx`: Carta da Dra. Joana Prioste (14/02/2025) a propor `87.556,50 €` de tornas (`29.185,50 €` por filho), ficando os filhos com os prédios rústicos/casa (`87.000,00 €`) e Olha com os urbanos (`291.484,00 €`).\n   - `2025-07_Carta_Dra_Joana_Prioste_Proposta_75000eur_Contestacao_Art2707_e_Valorizacao.txt`: Resposta contundente da Dra. Joana Prioste à carta de 06/06/2025, desmontando a inclusão de 100% da casa de Valado de Santa Quitéria, exigindo que a cabeça-de-casal legalize os terrenos se invoca a \"Nova Lei dos Solos\", demonstrando a valorização de +48%/+49% em Carregado e VFX, e propondo `75.000,00 €` (`25.000,00 €` por filho).\n3. **`03_Cadernetas_Prediais_e_Financas/`**\n   - `Caderneta_Predial_Urbana_Art_2707_ex_2573_Valado_Santa_Quiteria_Graciete_Novo.jpg`: **DESCOBERTA CRÍTICA (`dig6.jpg`)** — Caderneta Predial Urbana oficial do **Artigo 2707** (ex-Artigo Rústico `2573`, Alfeizerão), que prova que **a titular inscrita a `1/1` (Propriedade Plena) nas Finanças é exclusivamente `GRACIETE DA CONCEIÇÃO NOVO` (NIF `180774450`)**, com `500,00 m²` de terreno, `110,00 m²` de implantação e **Valor Patrimonial Tributário (VPT) de apenas `€37.840,00`**!\n   - `Caderneta_Predial_Urbana_Art_726_Carregado_Pag1.jpg` e `Pag2.jpg`: Prova oficial de que a **Fração J do Art. 726 (Carregado) tem `104,00 m²` de Área Bruta Privativa** (e não os `78,00 m²` falsificados pelo perito da Olha!).\n   - `Caderneta_Predial_Urbana_Art_3483_VilaFrancaXira_Pag1.jpg` e `Pag2.jpg`: Prova oficial de que a **Fração A do Art. 3483 (VFX) tem `73,00 m²` de área bruta privativa + `34,50 m²` de terreno integrante (quintal)**.\n4. **`04_Avaliacoes_Imobiliarias_ERA_e_Perito_Olha/`**\n   - `2024-02-11_Estudo_Mercado_ERA_Casafari_Art726_Carregado.pdf` e `Art3483_VilaFrancaXira.pdf`: Estudos de mercado ERA (fev/2024).\n   - `2024-04-03_Relatorio_Avaliacao_Perito_Olha_Henrique_Dentinho.pdf`: Relatório do avaliador contratado pela Olha (Eng. Henrique Ponce Dentinho), repleto de manipulações técnicas facilmente destrutíveis em tribunal.\n5. **`05_Provas_Despesas_Contas_e_Fuga_Email_BricoGest/`**\n   - `2024-08_Comprovativos_Despesas_Olha_Com_Email_Interno_BricoGest_IMI_Seguro_BCP.pdf`: Documento CRÍTICO enviado pela contraparte que inclui, na pág. 1, o **email interno trocado entre o escritório do Dr. Fernando Palha (`Kemily Sousa`) e a BricoGest**, provando que fabricaram a estimativa de despesas de condomínio desde 2013 sem recibos.\n   - `2025-10-22_PROVA_Site_Fernando_Palha_Advogados_Olga_Bartolo_Assistente_Equipa.png`: **BOMBA FORENSE DESCOBERTA NA SECRETÁRIA** — Captura de ecrã oficial do site `fernandopalha-advogados-vfx.com/sobre-nos-about/equipa-team` que prova que **`Olga Bartolo (UK, RUS)` trabalha como Assistente no próprio escritório de advogados do Dr. Fernando Palha**!\n6. **`06_Dossiers_Estrategia_e_Simulacoes/`**\n   - `Dossier_Heranca_Serafim_2025.pdf`, `GoogleDoc_HERANCA_Serafim_2025.txt`, `Memorando_Juridico_Estrategia_Contencioso_2026.docx`, e todas as folhas de cálculo extraídas do Google Sheets (`GoogleSheet_Heranca_Serafim_Folha1.csv`, `Folha2.csv`, `Copia_Folha1_Despesas.csv`, `Proposta_OLGA.csv` e `GoogleSheet_Avaliacao_Predios_Heranca.csv`).\n\n---\n\n## 🔥 2. AS 6 BOMBAS FORENSES DESCOBERTAS NOS DOCUMENTOS (PARA DESTRUIR A DEFESA DE OLHA E DO DR. FERNANDO PALHA)\n\n### BOMBA 1: A Prova do Conluio Interno — Olga Bartolo é Funcionária/Assistente do Escritório do Dr. Fernando Palha!\nNo ficheiro `2025-10-22_PROVA_Site_Fernando_Palha_Advogados_Olga_Bartolo_Assistente_Equipa.png`, retirado da página oficial da equipa do escritório (`fernandopalha-advogados-vfx.com/sobre-nos-about/equipa-team`), surge listada em **\"Assistentes / Assistants\"**:\n> **`Olga Bartolo (UK, RUS)`** (ao lado de Teresa Martins e Celeste Soares, no escritório da R. Almirante Cândido dos Reis 95, Lj 3, Vila Franca de Xira).\n\n- **Porque é que isto muda tudo em Tribunal e na Ordem dos Advogados?**\n  1. **Explica o fabrico interno de provas:** Não estamos perante um advogado independente que foi \"enganado\" por uma cliente externa. A cliente (**Olga Bartolo**) trabalha dentro do próprio escritório do **Dr. Fernando Palha**! Foi uma colega de escritório dela (`Kemily Sousa`) quem enviou o email de 09/08/2024 à BricoGest a pedir *\"3 ou 4 recibos para fazermos uma estimativa desde 2013\"*, que o Dr. Fernando Palha depois transformou numa reclamação formal de `3.710,00 €` de condomínio + `4.130,00 €` de obras sem fatura!\n  2. **Destrói a narrativa de \"pobreza / falta de rendimentos\":** Na carta de 06/06/2025, o Dr. Fernando Palha alegou que a Olha teve de meter hóspedes clandestinos nos imóveis da herança para conseguir pagar o empréstimo e o IMI. Ora, além da reforma de sobrevivência e do trabalho na padaria/restante atividade, ela é assistente jurídica/intérprete (`UK, RUS`) no próprio escritório de advogados dele!\n  3. **Violação Deontológica Grave (Art. 89.º e Art. 90.º do Estatuto da Ordem dos Advogados — EOA):** O advogado tem o dever estrito de independência e de não fabricar nem usar meios desleais ou provas que sabe serem inexistentes no seu próprio escritório.\n\n### BOMBA 2: A Caderneta Predial Urbana Oficial do Art. 2707 (Valado de Santa Quitéria) Está 100% (`1/1`) em Nome da Tua Mãe (`Graciete Novo`) e tem VPT de `37.840,00 €`!\nNo ficheiro `Caderneta_Predial_Urbana_Art_2707_ex_2573_Valado_Santa_Quiteria_Graciete_Novo.jpg` (encontrado em `Downloads/dig6.jpg`):\n- **Artigo Matricial:** `2707` (Urbano), que **\"TEVE ORIGEM NOS ARTIGOS: Tipo RÚSTICO, Artigo: 2573\"** (Freguesia de Alfeizerão, Concelho de Alcobaça).\n- **Áreas Oficiais:** Terreno = `500,00 m²` | Implantação e Área Bruta Privativa = `110,00 m²` (inscrito na matriz em `1993`).\n- **Valor Patrimonial Tributário (VPT):** **`€37.840,00`** (avaliado pelas Finanças em `2013/02/13`).\n- **TITULARES INSCRITOS:** **`GRACIETE DA CONCEIÇÃO NOVO` (NIF `180774450`) — `Tipo de titular: Propriedade plena | Parte: 1/1`**!\n- **Impacto Demolidor:**\n  - Enquanto o Dr. Fernando Palha e o perito Henrique Dentinho avaliaram este imóvel em **`195.000,00 €`** e na carta de 06/06/2025 o Dr. Fernando Palha somou **100% do imóvel (`180.000,00 €`) como se pertencesse por inteiro à herança de Serafim**, a Caderneta Predial oficial prova que o prédio urbano está inscrito a **`1/1` em nome exclusivo de D. Graciete da Conceição Novo** e tem um VPT de apenas **`37.840,00 €`**!\n  - Isto prova documentalmente porque é que em 2019 o Dr. Fernando Palha te disse *\"com todos os dentes na boca\"* que a casa não entrava na herança do teu pai, e prova a má-fé clamorosa com que em 2024/2025 tentou incluir 100% da casa (`180.000 €–195.000 €`) nas contas da herança!\n\n### BOMBA 3: A \"Fuga Acidental\" do Email Interno com a BricoGest (Prova de Fabricação de Despesas / Litigância de Má-Fé)\nNo ficheiro `2024-08_Comprovativos_Despesas_Olha_Com_Email_Interno_BricoGest_IMI_Seguro_BCP.pdf` (Página 1), o escritório do Dr. Fernando Palha anexou por descuido o email enviado à BricoGest a **09/08/2024**:\n> *\"Em nome de Olha Bartolo, venho neste pedir que nos forneça uma declaração dos valores pagos pela mesma ao condomínio, e/ou comprovativos/recibos, de pagamentos feitos ao condomínio, **o máximo que conseguirem encontrar (pelo menos 3 ou 4)**... **Esta informação servirá para fazermos uma estimativa do que ela vem tendo de despesas com o condomínio com obras e taxas no geral, desde 2013, com o falecimento do marido, até atualmente.**\"*\n\nA BricoGest respondeu no mesmo documento (a **13/08/2024**):\n> *\"Informamos que **não conseguimos localizar nada no processo entregue pela anterior empresa de administração, que nos diga existirem valores em falta e ou por liquidar, nem quais os valores que a Senhora entregou para liquidar as despesas a que se refere**... No que diz respeito à gestão efetuada por nós, informamos que a quota relativa à fração em causa é de 20.00€ mensais e está paga até Abril de 2024.\"*\n\nApesar de só terem **2 recibos num total de `280,00 €`** (pág. 3 e 5), na carta oficial de **23/09/2024** o Dr. Fernando Palha reclamou **`3.710,00 €`** de condomínio + **`4.130,00 €`** de obras sem faturas + **`417,38 €`** de **\"Onze coimas liquidadas pela Administração Tributária\"**!\n\n### BOMBA 4: A Confissão Escrita de Arrendamento Clandestino (\"Hospedagem\") Nos Dois Imóveis e Evasão Fiscal\nNa carta oficial de **06/06/2025** (`2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem.pdf`), assinada e carimbada pelo Dr. Fernando Palha:\n- **Pág. 1, ponto 1-a) e b):** Confessa que *\"a minha constituinte não possui comprovativos de rendimentos com hospedagem, uma vez que a hospedagem no imóvel do Carregado artigo matricial n.º 726... se fez de maneira temporária... Posto isto, a mesma assume ter fornecido hospedagem no imóvel referido em alguns momentos\"*.\n- **Pág. 4, alínea b):** Confessa ainda: *\"considerando-se o rendimento que nos passados anos a minha constituinte tem vindo a obter pelo fornecimento de hospedagem no prédio urbano com o artigo matricial n.º 3483 [Vila Franca de Xira] e que, **não tem declarado por razões de não se ter obtido comprovativos**\"*!\n- **Mais:** Na apólice do seguro do Millennium BCP/Ocidental (pág. 10 dos comprovativos), o imóvel do Carregado continua declarado ao banco como *\"Residência Principal\"* em nome do falecido Serafim Bártolo!\n\n### BOMBA 5: A Confissão Escrita da Dívida de Pensão de Alimentos (`18.000,00 €` a `20.250,00 €`!)\nNa carta de **06/06/2025** (pág. 2, ponto 3-a e ponto 2-c), o Dr. Fernando Palha escreveu:\n> *\"3- Reconhecimento de Dívidas e Despesas: a) **O falecido deixou uma dívida de pensão de alimentos, acumulada durante 10 anos, desde o divórcio em 2003 e falecimento em 2013, no valor de, pelo menos, 18.000,00€, reconhecida**, e não integrada na massa da herança, do qual está a ser tida em consideração para compensação dos filhos herdeiros, o valor de **20.250,00€**.\"*\n- Nos termos do **Art. 325.º, n.º 1 do Código Civil**, este reconhecimento escrito interrompe qualquer prescrição e constitui **confissão extrajudicial escrita** (Art. 358.º, n.º 2 do CC)!\n\n### BOMBA 6: A Fraude Técnica no Relatório de Avaliação de Henrique Ponce Dentinho (03/04/2024)\n1. **Corte falso de 25% da área do apartamento do Carregado (Art. 726):** Na Caderneta Predial Urbana oficial, a área bruta privativa é de **`104,00 m²`**. O perito escreveu na pág. 2, al. g) que a área era inferior à caderneta e usou **`78,00 m²`** (-26 m²!) para forçar a avaliação a descer para `110.000 €`.\n2. **Disparidade absurda entre .000,00 €` | `20.250,00 €` | **Confessada por escrito** pelo Dr. Fernando Palha na carta de 06/06/2025 (pág. 2, ponto 3-a). |\n| **4. Quota dos 3 filhos (37,5%) nas Rendas/Hospedagem (Carregado e VFX)** | `13.500,00 €` | `20.250,00 €` | **Hospedagem confessada por escrito** na carta de 06/06/2025 (pág. 1 e pág. 4) + prova de consumos de água/luz. |\n| **5. Saldos Bancários de Serafim à data do óbito (31/12/2013)** | *A apurar via Banco de Portugal* | *A apurar via Banco de Portugal* | Ofício judicial ao Banco de Portugal (contas de `NIF 112309178`). |\n| **SUBTOTAL BRUTO A FAVOR DOS 3 IRMÃOS** | **`160.875,00 €`** | **`194.250,00 €`** | **(`53.625,00 €` a `64.750,00 €` por irmão)** |\n\nE o que é que a Olha pode descontar se vocês ficarem com os terrenos rústicos (`2574` e `2590`) e com a eventual meação do terreno/tosco de 2003 da casa da mãe (`2573`/`2707`)?\n- **Terrenos rústicos (`2574` e `2590`):** 25% de `24.000 €` = **`-6.000,00 €`**.\n- **Meação do terreno/tosco de 2003 (`2573`/`2707`):** Como a Caderneta Urbana (`Art. 2707`) está inscrita a **`1/1` em nome de D. Graciete Novo** com VPT de **`37.840,00 €`**, e todas as obras pós-2003 são benfeitorias pagas pela tua mãe (Art. 1273.º CC), a quota de 1/4 da Olha sobre a metade do pai no terreno/tosco de 2003 vale apenas **`-4.730,00 €` a `-8.750,00 €`** (12,5% do VPT de `37.840 €` ou de `70.000 €`).\n- **Despesas dos imóveis urbanos:** Na própria carta de 06/06/2025 (pág. 1, ponto 1-b), a contraparte **já confessou que as despesas foram compensadas com os rendimentos da hospedagem**!\n- **SALDO LÍQUIDO REAL EM TRIBUNAL A FAVOR DOS 3 IRMÃOS:** **`134.000,00 €` a `179.500,00 €`** (`44.666,00 €` a `59.833,00 €` para cada irmão), além de ficarem com 100% da casa da mãe e dos terrenos!\n", "driveId": "1pKsLXLe3Ge_hLuHLgoeF0B3ZJ0nT37nB", "driveViewUrl": "https://drive.google.com/file/d/1pKsLXLe3Ge_hLuHLgoeF0B3ZJ0nT37nB/view", "drivePreviewUrl": "https://drive.google.com/file/d/1pKsLXLe3Ge_hLuHLgoeF0B3ZJ0nT37nB/previe samento (50%) + herdeira de 1/4 da herança (total de 5/8 nos bens comuns e 1/4 nos bens próprios do falecido).\n- **Mandatário da Cabeça-de-Casal (e sua Entidade Patronal/Escritório):** **Dr. Fernando Ferreira Palha** (Cédula Profissional `10163L`, NIF `131414828`, R. Almirante Cândido dos Reis 95, Lj 3, Vila Franca de Xira).\n- **Terceira Credora e Titular Fiscal Inscrita (`1/1`) do Art. Urbano 2707 (Ex-Cônjuge / Mãe dos 3 Filhos):** **Graciete da Conceição Novo** (NIF `180774450`).\n\n---\n\n## 2. O QUE QUEREMOS QUE O ADVOGADO FAÇA IMEDIATAMENTE (SEM MAIS CARTAS INTERMINÁVEIS)\n\nApós **12 anos de ocultação de rendimentos e má administração (2013–2026)**, a Cabeça-de-Casal recusa pagar o valor justo das tornas (ofereceu `18.000 €` em set/2024 e `41.250 €` em jun/2025 para dividir pelos 3 filhos, quando só os dois apartamentos urbanos no Carregado e em Vila Franca de Xira valem hoje entre `390.000 €` e `440.000 €`).\n\n**Instruções expressas para o Advogado:**\n1. **Enviar UMA ÚNICA NOTIFICAÇÃO PRÉ-JUDICIAL FINAL (prazo improrrogável de 10 dias úteis):**\n   - Exigir o pagamento líquido imediato de **`87.000,00 €` (`29.000,00 €` a cada filho)** — ou o mínimo absoluto que os 3 irmãos definirem (nunca abaixo de `75.000,00 €`–`87.000,00 €` líquidos) — ficando os 3 filhos com a quota do pai nos prédios de Alfeizerão (`2573/2753/2707`, `2574` e `2590`) e a Olha com os 2 apartamentos urbanos (`726` Carregado e `3483` VFX).\n   - Anexar a essa notificação as **6 Provas Forenses** abaixo, avisando que, findo o prazo de 10 dias sem aceitação, dará entrada imediata em Tribunal e nas entidades fiscais/reguladoras.\n2. **Se não pagar em 10 dias, dar entrada imediata em Tribunal (Juízo Local Cível de Vila Franca de Xira) de:**\n   - **Ação de Processo de Inventário Judicial (Arts. 1082.º e ss. do CPC)** cumulada com:\n     - **Incidente de Remoção de Cabeça-de-Casal (Art. 2088.º, n.º 1, als. a), b) e c) do CC e Art. 1103.º do CPC)**, nomeando-se **Ângelo Emanuel Novo Bártolo** como novo Cabeça-de-Casal;\n     - **Ação Especial de Prestação Forçada de Contas (Art. 2093.º do CC e Art. 941.º do CPC)** desde `31/12/2013` até à presente data;\n     - **Pedido de Condenação da Cabeça-de-Casal (e responsabilidade pessoal do Mandatário) por Litigância de Má-Fé (Arts. 542.º, 543.º e 545.º do CPC)**.\n\n---\n\n## 3. AS 6 PROVAS DOCUMENTAIS PRONTAS A JUNTAR À PETIÇÃO INICIAL\n\nTodas estas provas estão na pasta `PROCESSO_HERANCA_SERAFIM_BARTOLO`:\n\n1. **DOC. 1 — Confissão Escrita de Arrendamento/Hospedagem Não Declarada às Finanças nos 2 Imóveis Urbanos (`2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem.pdf`):**\n   - Na **pág. 1, ponto 1-a e b)**, o Dr. Fernando Palha confessa por escrito que a Cabeça-de-Casal forneceu hospedagem remunerada sem comprovativos no imóvel do Carregado (**Art. 726, Fração J**).\n   - Na **pág. 4, alínea b)**, confessa por escrito: *\"considerando-se o rendimento que nos passados anos a minha constituinte tem vindo a obter pelo fornecimento de hospedagem no prédio urbano com o artigo matricial n.º 3483 [Vila Franca de Xira] e que, **não tem declarado por razões de não se ter obtido comprovativos**\"*.\n2. **DOC. 2 — Confissão Escrita da Dívida de Pensão de Alimentos do Falecido no Valor de `18.000,00 €` a `20.250,00 €` (`2025-06-06_Contraproposta...pdf`, pág. 2, ponto 3-a):**\n   - O mandatário da Cabeça-de-Casal escreveu e assinou: *\"O falecido deixou uma dívida de pensão de alimentos, acumulada durante 10 anos, desde o divórcio em 2003 e falecimento em 2013, **no valor de, pelo menos, 18.000,00€, reconhecida**, e não integrada na massa da herança, do qual está a ser tida em consideração para compensação dos filhos herdeiros, o valor de **20.250,00€**.\"*\n   - Constituindo **reconhecimento escrito de dívida que interrompe qualquer prescrição (Art. 325.º, n.º 1 do CC)** e **confissão extrajudicial escrita (Art. 358.º, n.º 2 do CC)**, este passivo de **`20.250,00 €`** tem de ser relacionado e pago aos filhos/mãe com prioridade!\n3. **DOC. 3 — Fuga Acidental do Email Interno à BricoGest a Provar Fabricação de Despesas (`2024-08_Comprovativos_Despesas_Olha_Com_Email_Interno_BricoGest_IMI_Seguro_BCP.pdf`, pág. 1):**\n   - O escritório do Dr. Fernando Palha (`Kemily Sousa`) pediu por email à BricoGest em `09/08/2024` *\"3 ou 4 recibos... para fazermos uma estimativa do que ela vem tendo de despesas com o condomínio com obras e taxas no geral, desde 2013\"*.\n   - A BricoGest respondeu a `13/08/2024` que a quota é de `20,00 €/mês`, que não há qualquer registo de pagamentos anteriores e emitiu apenas `280,00 €` de recibos (pág. 3 e 5).\n   - Mesmo assim, na carta de `23/09/2024`, o Dr. Fernando Palha reclamou **`3.710,00 €`** de condomínio + **`4.130,00 €`** de obras sem faturas + **`417,38 €`** de **11 coimas fiscais da AT** causadas pela própria negligência da Cabeça-de-Casal!\n4. **DOC. 4 — Prova de Relação Laboral Interna entre Olha Bártolo e o Escritório do Dr. Fernando Palha (`2025-10-22_PROVA_Site_Fernando_Palha_Advogados_Olga_Bartolo_Assistente_Equipa.png`):**\n   - Captura de ecrã oficial do site do escritório (`fernandopalha-advogados-vfx.com/sobre-nos-about/equipa-team`) onde **`Olga Bartolo (UK, RUS)`** figura como **Assistente** do próprio escritório do Dr. Fernando Palha.\n5. **DOC. 5 — Cadernetas Prediais Oficiais vs. Fraude no Relatório Pericial de Henrique Dentinho (`03_Cadernetas_Prediais_e_Financas/` e `04_Avaliacoes_Imobiliarias_ERA_e_Perito_Olha/`):**\n   - **Carregado (`Art. 726, Fração J`):** A Caderneta Predial oficial prova **`104,00 m²` de Área Bruta Privativa**, mas o perito da Olha cortou a área para **`78,00 m²`** (-25%) para baixar a avaliação para `110.000 €`.\n   - **Valado de Santa Quitéria (`Art. Urbano 2707`, ex-`Rústico 2573`):** A Caderneta Predial oficial prova que o prédio urbano tem **VPT de `37.840,00 €`** e está inscrito a **`1/1` (Propriedade Plena) exclusivamente em nome de `GRACIETE DA CONCEIÇÃO NOVO` (NIF `180774450`)**. Na pág. 10 do seu relatório, o perito da Olha omitiu o Método de Mercado (cujo preço médio na própria tabela dele era de `932,40 €/m²`) e inventou um terreno a `160 €/m²` + `45.266 €` de \"Margem do Promotor\" para inflacionar uma obra inacabada e sem licença para `195.000 €`!\n\n---\n\n## 4. DILIGÊNCIAS DE PROVA A REQUERER AO JUIZ LOGO NA PETIÇÃO INICIAL\n\n1. **Ofício ao Banco de Portugal (Art. 417.º e 1105.º do CPC):** Para identificar todas as contas bancárias, depósitos a prazo, certificados e seguros de vida titulados ou co-titulados por Serafim António Maria Bártolo (`NIF 112309178`) à data do óbito (`31/12/2013`) e extratos até à presente data.\n2. **Ofício às Águas de Alenquer / EPAL e à E-Redes / EDP Comercial:** Para juntar o histórico de contratos e consumos mensais de água e eletricidade na **Praceta Infante D. Henrique, Lote 49, 4.º Esq., Carregado (`Art. 726, Fração J`)** e na **Rua José da Costa Silva, n.º 72, R/C Dt.º, Povos, VFX (`Art. 3483, Fração A`)** desde `01/01/2014` até hoje — provando matematicamente todos os meses e anos de ocupação/arrendamento!\n3. **Ofício à Autoridade Tributária (AT):** Para juntar as declarações de IRS de Olha Makarovska Bártolo (`NIF 235492639`) e eventuais recibos/contratos da Herança Indivisa (`NIF 741030756`), confrontando-os com a confissão escrita de hospedagem não declarada de `06/06/2025`.\n4. **Perícia Judicial Colegial ou por Perito Único da Lista Oficial do Tribunal (Art. 1114.º do CPC):** Para avaliar os apartamentos do Carregado (`104 m²`) e de VFX (`73 m² + 34,5 m² quintal`) a preços reais de 2026, e para avaliar separadamente o valor do terreno/tosco de 2003 sem licença em Valado de Santa Quitéria e o **Crédito por Benfeitorias Necessárias e Úteis de D. Graciete Novo (Art. 1273.º do CC)**.\n", "driveId": "1ym18gSWb2kDsHPbKsjhi1jkmYxyfe3o5", "driveViewUrl": "https://drive.google.com/file/d/1ym18gSWb2kDsHPbKsjhi1jkmYxyfe3o5/view", "drivePreviewUrl": "https://drive.google.com/file/d/1ym18gSWb2kDsHPbKsjhi1jkmYxyfe3o5/preview"}, {"id": "07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao/2_GUIA_APOIO_JUDICIARIO_SEGURANCA_SOCIAL_PARA_A_IRMA.md", "name": "2_GUIA_APOIO_JUDICIARIO_SEGURANCA_SOCIAL_PARA_A_IRMA.md", "title": "Instruções de Preenchimento do Apoio Judiciário (Segurança Social — Mod. PJ 1)", "relPath": "07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao/2_GUIA_APOIO_JUDICIARIO_SEGURANCA_SOCIAL_PARA_A_IRMA.md", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/2_GUIA_APOIO_JUDICIARIO_SEGURANCA_SOCIAL_PARA_A_IRMA_TRANSCRICAO.txt", "ext": "md", "category": "7. Pareceres & Guias Processuais", "essential": false, "order": 73, "sizeKb": 5.0, "transcriptText": "======================================================================\nDOCUMENTO: Instruções de Preenchimento do Apoio Judiciário (Segurança Social — Mod. PJ 1)\nCATEGORIA: 7. Pareceres & Guias Processuais\nFICHEIRO ORIGINAL: 07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao/2_GUIA_APOIO_JUDICIARIO_SEGURANCA_SOCIAL_PARA_A_IRMA.md\n======================================================================\n\n# 🛡️ GUIA PASSO A PASSO: COMO A TUA IRMÃ PODE TER ADVOGADO E TRIBUNAL 100% GRATUITOS (APOIO JUDICIÁRIO)\n\nSe a tua irmã (**Marisa Novo Bártolo** ou **Liliana Novo Bártolo Lima**) tem baixos rendimentos ou não tem disponibilidade financeira, a lei portuguesa (**Lei n.º 34/2004 — Regime de Acesso ao Direito e aos Tribunais**) garante-lhe **Proteção Jurídica / Apoio Judiciário** através da **Segurança Social**.\n\nE há aqui uma **vantagem estratégica enorme para vocês os três**:\n> **Basta que UM único herdeiro (a tua irmã, com Apoio Judiciário aprovado) dê entrada do Processo de Inventário Judicial e da Ação de Prestação de Contas para que o processo avance em Tribunal SEM ELA PAGAR NADA de Taxas de Justiça, Honorários de Advogado nem Custos da Perícia Judicial do Tribunal!**\n\n---\n\n## 1. A QUE É QUE A TUA IRMÃ TEM DIREITO NO APOIO JUDICIÁRIO?\n\nNo formulário da Segurança Social (`Mod. PJ 1 - DGSS`), ela deve assinalar **duas modalidades em simultâneo**:\n1. **Dispensa de taxa de justiça e demais encargos com o processo** (fica isenta de pagar taxas de tribunal, custos de peritos do tribunal para avaliar as casas e custas finais); **E**\n2. **Nomeação e pagamento da compensação de patrono** (a Ordem dos Advogados nomeia-lhe gratuitamente um Advogado pago pelo Estado).\n   - *(Nota: Se ela ganhar algum cabimento parcial, a Segurança Social pode conceder \"Pagamento faseado\", que também permite pagar em pequenas prestações mensais suaves, mas se o rendimento relevante para efeitos de proteção jurídica for baixo, a isenção é 100% total!)*\n\n---\n\n## 2. COMO PEDIR HOJE MESMO (ONLINE EM 15 MINUTOS NA SEGURANÇA SOCIAL DIRETA)\n\nA tua irmã **não precisa sequer de ir a uma repartição**. Pode fazer tudo no computador:\n\n### Passo 1: Entrar na Segurança Social Direta\n1. Aceder a **`https://app.seg-social.pt/`** com o NIF e a Senha da Segurança Social Direta da tua irmã (ou Chave Móvel Digital).\n2. No menu superior, clicar em:\n   **`Família` → `Proteção Jurídica` → `Pedir novo requerimento de proteção jurídica`**.\n   *(Em alternativa, pode descarregar os formulários `Mod. PJ 1 - DGSS` e `Mod. PJ 2 - DGSS` no site da Segurança Social e entregá-los num balcão da Segurança Social).*\n\n### Passo 2: O que preencher exatamente no Pedido (Copia e Cola este texto!)\nQuando o formulário perguntar a **Finalidade do Pedido / Objeto do Litígio**, ela deve escolher **\"Propor ação judicial\"** e escrever no campo de descrição:\n> **\"Instaurar Processo de Inventário Judicial para partilha da herança aberta por óbito de meu pai, Serafim António Maria Bártolo (NIF da Herança 741030756), cumulado com Incidente de Remoção de Cabeça-de-Casal (Olha Makarovska Bártolo, NIF 235492639) e Ação Especial de Prestação de Contas pelos rendimentos ocultos dos imóveis da herança desde 31/12/2013.\"**\n\n### Passo 3: Que modalidades assinalar?\nAssinalar as caixas:\n- `[X] Dispensa de taxa de justiça e demais encargos com o processo`\n- `[X] Nomeação e pagamento da compensação de patrono`\n\n### Passo 4: Documentos a anexar no portal (ou levar ao balcão)\n1. Cartão de Cidadão da tua irmã (e de quem viva com ela na mesma economia doméstica);\n2. Última Declaração de IRS + Nota de Liquidação (ou certidão das Finanças a comprovar que está dispensada de entregar IRS);\n3. Recibos de vencimento dos últimos 3 meses (ou comprovativo de subsídio de desemprego/apoio social, se aplicável);\n4. Cadernetas prediais ou indicação de que os únicos imóveis associados ao NIF dela são a quota-parte indivisa não partilhada da própria herança em litígio (os bens da própria herança que se vai disputar **não contam contra ela** para lhe negar apoio judiciário!).\n\n---\n\n## 3. EM QUANTO TEMPO É APROVADO E COMO FUNCIONA COM OS 3 IRMÃOS?\n\n1. **Prazo Legal e Deferimento Tácito (Art. 25.º da Lei n.º 34/2004):**\n   - A Segurança Social tem **30 dias corridos** para decidir o pedido.\n   - **Se passarem 30 dias sem resposta da Segurança Social, o pedido considera-se AUTOMATICAMENTE APROVADO por lei (*Deferimento Tácito*)**, bastando pedir à Ordem dos Advogados / Tribunal a nomeação imediata do patrono com o comprovativo de entrega há mais de 30 dias!\n2. **Como conjugar o Advogado da tua irmã com a vossa Advogada (Dra. Joana Prioste) ou convosco?**\n   - Quando a tua irmã tem **Apoio Judiciário com Dispensa Total de Taxas e Encargos**, **é a tua irmã quem figura como Requerente Principal do Processo de Inventário Judicial e da Prestação de Contas**!\n   - Assim, **a abertura do processo em Tribunal e o pedido de Perícia Judicial aos imóveis pela tua irmã têm custo ZERO de Taxa de Justiça Inicial e de Adiantamento de Encargos Periciais para ela**!\n   - Tu e a tua outra irmã são citados como interessados diretos no Inventário e aderem/acompanham integralmente a posição dela (podendo ser representados pela Dra. Joana Prioste ou agir em bloco com o patrono nomeado à tua irmã, entregando-lhe logo no 1.º dia o dossier completo `PROCESSO_HERANCA_SERAFIM_BARTOLO` que já deixei preparado!).\n", "driveId": "1u-qPHL4JDrVIZ6y1NKAL31LBoYCmnJLZ", "driveViewUrl": "https://drive.google.com/file/d/1u-qPHL4JDrVIZ6y1NKAL31LBoYCmnJLZ/view", "drivePreviewUrl": "https://drive.google.com/file/d/1u-qPHL4JDrVIZ6y1NKAL31LBoYCmnJLZ/preview"}, {"id": "07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao/3_INVESTIGACAO_OLHA_BARTOLO_MERCADO_2026_E_PROVAS_ALUGUER.md", "name": "3_INVESTIGACAO_OLHA_BARTOLO_MERCADO_2026_E_PROVAS_ALUGUER.md", "title": "Levantamento de Mercado Imobiliário (2026) e Meios de Prova do Arrendamento no Carregado", "relPath": "07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao/3_INVESTIGACAO_OLHA_BARTOLO_MERCADO_2026_E_PROVAS_ALUGUER.md", "transcriptRelPath": "11_Transcricoes_Integrais_Pesquisaveis/3_INVESTIGACAO_OLHA_BARTOLO_MERCADO_2026_E_PROVAS_ALUGUER_TRANSCRICAO.txt", "ext": "md", "category": "7. Pareceres & Guias Processuais", "essential": false, "order": 74, "sizeKb": 10.7, "transcriptText": "======================================================================\nDOCUMENTO: Levantamento de Mercado Imobiliário (2026) e Meios de Prova do Arrendamento no Carregado\nCATEGORIA: 7. Pareceres & Guias Processuais\nFICHEIRO ORIGINAL: 07_Guias_Prontos_Advogado_ApoioJudiciario_e_Investigacao/3_INVESTIGACAO_OLHA_BARTOLO_MERCADO_2026_E_PROVAS_ALUGUER.md\n======================================================================\n\n# 🕵️‍♂️ RELATÓRIO DE INVESTIGAÇÃO: OLHA BÁRTOLO, PROVAS DE ALUGUER/OCUPAÇÃO E VALORES REAIS DE MERCADO (2026)\n\n---\n\n## 1. TUDO O QUE DESCOBRIMOS SOBRE A OLHA BÁRTOLO (`NIF 235492639`)\n\n1. **Três Identidades / Variações de Nome Usadas nos Documentos:**\n   - **Nas Finanças e Cartas Judiciais:** `Olha Makarovska Bártolo` (NIF `235492639`).\n   - **Nas Minutas e Tabelas de 2019:** `Olga Bártolo` / `Olga Tsebrynska Bartolo`.\n   - **No Site do Escritório do Dr. Fernando Palha:** `Olga Bartolo (UK, RUS)`.\n2. **Morada Declarada:**\n   - `Rua José da Costa e Silva, n.º 72, R/C Direito, Povos, 2600-068 Vila Franca de Xira` (que corresponde exatamente à **Fração A do Artigo Urbano 3483** da herança!).\n3. **A Ligação Secreta ao Escritório do Advogado (E porque apagaram a página!):**\n   - Na captura de ecrã tirada a `22/10/2025` (`2025-10-22_PROVA_Site_Fernando_Palha_Advogados_Olga_Bartolo_Assistente_Equipa.png`), o site oficial do advogado (`fernandopalha-advogados-vfx.com/sobre-nos-about/equipa-team`) mostrava **`Olga Bartolo (UK, RUS)`** como **Assistente** do escritório na Rua Almirante Cândido dos Reis, n.º 95, Loja 3, Vila Franca de Xira.\n   - **Verificação técnica realizada hoje:** A subpágina `/sobre-nos-about/equipa-team` do site `fernandopalha-advogados-vfx.com` foi entretanto **removida/desativada (devolve erro `HTTP 404`)**! Isto torna a tua captura de ecrã de `22/10/2025` uma **prova documental insubstituível** de que ela trabalhava como assistente (para clientes ucranianos e russos) dentro do próprio escritório do Dr. Fernando Palha!\n4. **As 11 Coimas Fiscais nas Finanças (`NIF 741030756` / `NIF 112309178`):**\n   - Na carta de `23/09/2024` (Verba 7 dos Encargos), o Dr. Fernando Palha admite que existem **\"Onze coimas liquidadas pela Administração Tributária\"** no valor de `417,38 €`.\n   - Uma Cabeça-de-Casal tem o dever legal de cumprir as obrigações fiscais da herança (Art. 2079.º do CC). A existência de 11 coimas fiscais é prova objetiva de **incumprimento reiterado dos deveres fiscais e de administração**!\n\n---\n\n## 2. INVESTIGAÇÃO AOS IMÓVEIS, CONTAS E COMO PROVAR A OCUPAÇÃO / ALUGUER ILEGAL\n\n### A) O que já está PROVADO POR CONFISSÃO ESCRITA (Não pode ser negado em Tribunal!)\nMuitas vezes os herdeiros têm dificuldade em provar um arrendamento sem contrato. **No vosso caso, o Dr. Fernando Palha cometeu o erro fatal de confessar o arrendamento/hospedagem clandestina POR ESCRITO na carta oficial assinada de `06/06/2025`** (`2025-06-06_Contraproposta_Fernando_Palha_41250eur_Confissao_Alimentos_e_Hospedagem.pdf`):\n1. **No Apartamento T2 do Carregado (`Art. 726, Fração J` — Praceta Infante D. Henrique, Lote 49, 4.º Esq.):**\n   - Confessou na **pág. 1, ponto 1-a e b)** que a Olha *\"forneceu hospedagem no imóvel referido em alguns momentos\"* sem recibos nem comprovativos, e que usou esse dinheiro para pagar as despesas do imóvel!\n   - Mais: na apólice do seguro multirriscos do **Millennium BCP / Ocidental (`Apólice MR79798704`)**, enviada pela própria Olha na pág. 10 dos comprovativos de agosto de 2024, o imóvel continua falsamente declarado ao Banco como **\"Residência Principal\"** e em nome do falecido `SERAFIM ANTONIO MARIA BARTOLO`!\n2. **No Apartamento T1 de Vila Franca de Xira (`Art. 3483, Fração A` — Rua José da Costa e Silva, n.º 72, R/C Dt.º):**\n   - Confessou na **pág. 4, alínea b)** que a Olha também tem vindo a obter rendimentos de **\"hospedagem no prédio urbano com o artigo matricial n.º 3483 e que, não tem declarado por razões de não se ter obtido comprovativos\"**!\n   - Ou seja: ela aluga quartos a terceiros (provavelmente cidadãos ucranianos/russos que ela própria angaria através dos seus contactos e trabalho no escritório!) tanto no Carregado como no próprio apartamento de Vila Franca de Xira!\n\n### B) As 4 Provas Adicionais Infalíveis de Ocupação/Arrendamento (Como obtê-las já):\n1. **Histórico de Consumos de Água e Luz (Prova Matemática Irrefutável):**\n   - Uma casa vazia gasta **`0 m³` de água** e **`0 kWh` de luz**. Uma casa com inquilinos ou hóspedes gasta entre **`8 m³` e `18 m³` de água/mês** e **`150 kWh` a `400 kWh` de luz/mês**.\n   - **Como obter:**\n     - **Via Direta (como herdeiro habilitado):** Com a Habilitação de Herdeiros e a Certidão das Finanças da Herança (`NIF 741030756`), qualquer herdeiro pode pedir na **Águas de Alenquer** (para o Carregado) e na **E-Redes / EDP Comercial** se existem contratos ativos em nome do falecido Serafim Bártolo (`NIF 112309178`) e pedir a 2.ª via das faturas/leituras.\n     - **Via Tribunal (se o contrato estiver em nome da Olha ou dos inquilinos):** Na Petição Inicial do Inventário/Prestação de Contas, a advogada pede ao Juiz que oficie à **Águas de Alenquer**, aos **SMAS de Vila Franca de Xira** e à **E-Redes** (operador da rede elétrica nacional, que regista todas as leituras do contador do **CPE** do imóvel independentemente do comercializador!) para juntarem os consumos mensais dos contadores das duas frações desde `01/01/2014` até `2026`!\n2. **Verificação no Portal das Finanças da Herança (`NIF 741030756`) e do Falecido (`NIF 112309178`):**\n   - Verificar se algum inquilino declarou a morada fiscal na `Praceta Infante D. Henrique, Lote 49, 4.º Esq., 2580-559 Carregado` ou deduziu rendas no IRS com o NIF da herança ou da Olha.\n3. **Nomes na Caixa do Correio, Campainha e Testemunho dos Vizinhos / Inquilina do Carregado:**\n   - Tirar fotografia datada à caixa de correio e campainhas do `4.º Esq.` no Lote 49 da Praceta Infante D. Henrique (Carregado).\n   - Arrolar como testemunha a inquilina/vizinhos do prédio do Carregado que vos confirmaram que o apartamento esteve arrendado durante mais de 6 anos (e a própria vizinha/administração anterior antes da BricoGest assumir em março de 2023).\n4. **Rastreio das Contas Bancárias do Teu Pai (`NIF 112309178`):**\n   - Sabemos pelos documentos que a Olha juntou (`2024-08_Comprovativos_Despesas...pdf`, págs. 7 a 10) que o teu pai tinha conta e empréstimo no **Banco Comercial Português (Millennium BCP)** (Contrato de Crédito `541559661` / Apólice `MR79798704`, Balcão `1262 CARREGADO`).\n   - Em Tribunal (ou através do **Banco de Portugal — Base de Dados de Contas Bancárias** apresentando a Habilitação de Herdeiros e Certidão de Óbito num balcão do Banco de Portugal ou online em `bportugal.pt`), vocês têm o **direito legal enquanto herdeiros** de obter a lista completa de todas as contas bancárias ativas de Serafim Bártolo em `31/12/2013` e de exigir no Millennium BCP o extrato bancário da conta à data do óbito (`31/12/2013`) para ver que saldo lá estava e quem o levantou!\n\n---\n\n## 3. VALORES REAIS DE VENDA E DE ARRENDAMENTO EM 2026 (DADOS REAIS DE MERCADO)\n\nCruzámos as áreas oficiais das Cadernetas Prediais com os dados reais de mercado de **2025/2026** (Idealista, Imovirtual e estudos Casafari/ERA atualizados) para as duas artérias exatas:\n\n### A) Apartamento T2 no Carregado (`Praceta Infante D. Henrique, n.º 49, 4.º Esq.` — Fração J, Art. 726)\n- **Área Oficial na Caderneta Predial:** **`104,00 m²` de Área Bruta Privativa** + `13,80 m²` de área dependente (Total: `117,80 m²`). *(Lembra-te: o perito da Olha mentiu dizendo que tinha 78 m²!).*\n- **Valor Real de Venda Hoje (2026):**\n  - Preço médio no Carregado/Urbanização da Barrada em 2026: **`2.100 €/m²` a `2.300 €/m²`**.\n  - Na própria **Praceta Infante D. Henrique**, os T2 anunciados em 2025/2026 (mesmo com áreas menores, de 80–90 m²) estão entre **`210.000 €` e `250.000 €`**.\n  - Aplicando um desconto prudente por ser 4.º andar sem elevador (`1.850 €/m²` a `2.050 €/m²` sobre os `104,00 m²` oficiais):\n    - **Valor de Venda Conservador (2026):** **`192.400,00 €`**\n    - **Valor de Venda Realista de Mercado (2026):** **`213.200,00 €`** *(contra os ridículos `110.000 €` que a Olha quer usar!)*\n- **Valor Real de Arrendamento Mensal:**\n  - **Hoje (2025/2026):** A média no Carregado está em **`12,0 €/m² a 12,5 €/m²`**, o que num T2 de `104 m²` corresponde a **`950,00 €/mês` a `1.150,00 €/mês`** (ou `350 € a 450 €/quarto` em regime de hospedagem de trabalhadores/imigrantes).\n  - **Acumulado Histórico (2014 a 2026):**\n    - Mesmo contabilizando apenas **8 anos (96 meses)** de arrendamento/hospedagem a uma média histórica conservadora de **`550,00 €/mês` a `650,00 €/mês`**, o imóvel gerou entre **`52.800,00 €` e `62.400,00 €` de rendas brutas**!\n    - **Quota dos 3 irmãos nas rendas do Carregado (`37,5%`):** **`19.800,00 €` a `23.400,00 €`**!\n\n---\n\n### B) Apartamento T1 + Quintal em Vila Franca de Xira (`Rua José da Costa e Silva, n.º 72, R/C Dt.º, Povos` — Fração A, Art. 3483)\n- **Área Oficial na Caderneta Predial:** **`73,00 m²` de Área Bruta Privativa + `34,50 m²` de Terreno Integrante / Quintal exclusivo** (`85,00 m²` de área bruta ponderada).\n- **Valor Real de Venda Hoje (2026):**\n  - Preço médio em Povos / Vila Franca de Xira em 2026: **`2.200 €/m²` a `2.425 €/m²`**.\n  - Na zona da **Rua José da Costa e Silva**, apartamentos T1 mais pequenos (`59 m²`, sem quintal) já são comercializados a partir de **`215.000 €`**, e os T2 entre `250.000 €` e `335.000 €`.\n  - Para este T1 amplo (`73 m²` — área de muitos T2!) com um quintal privativo de `34,50 m²`:\n    - **Valor de Venda Conservador (2026):** **`187.000,00 €`**\n    - **Valor de Venda Realista de Mercado (2026):** **`206.000,00 €`** *(contra os `120.000 €` que a Olha quer usar!)*\n- **Valor Real de Arrendamento / Uso Exclusivo / Hospedagem:**\n  - **Hoje (2025/2026):** A média em Vila Franca de Xira é de **`13,1 €/m²`**, o que num T1 de `73 m²` + quintal corresponde a **`850,00 €/mês` a `1.000,00 €/mês`**.\n  - E lembra-te: na pág. 4, alínea b) da carta de `06/06/2025`, o próprio Dr. Fernando Palha **confessou por escrito que a Olha também obteve rendimentos de hospedagem não declarados neste imóvel (`Art. 3483`)**!\n\n---\n\n### C) Resumo Comparativo: O que a Olha diz vs. O Valor Real de 2026\n\n| Imóvel Urbano da Herança | Avaliação da Olha (2024) | Valor Real de Venda Hoje (2026) | Renda Mensal Atual (2026) | Quota dos 3 Filhos (37,5%) no Valor de Venda de 2026 |\n| :--- | :---: | :---: | :---: | :---: |\n| **T2 Carregado (`104 m²`, Art. 726-J)** | `110.000,00 €` *(mentiu na área: 78 m²)* | **`192.400 €` a `213.200 €`** | `950 €` a `1.150 €/mês` | **`72.150,00 €` a `79.950,00 €`** |\n| **T1 + Quintal VFX (`73 m² + 34,5 m²`, Art. 3483-A)** | `120.000,00 €` | **`187.000 €` a `206.000 €`** | `850 €` a `1.000 €/m function fmtEur(val) {
  return new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(val || 0);
}

function showToast(msg = "Guardado") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1600);
}

async function loadState() {
  try {
    let stData = null;
    let docData = null;
    const isCloudOrStandalone = window.location.protocol === "file:" || window.STANDALONE_DRIVE_MODE || window.CLOUD_ONLINE_MODE || window.location.hostname.includes("github.io");
    if (isCloudOrStandalone) {
      const savedLocal = localStorage.getItem("heranca_serafim_state_v14");
      stData = savedLocal ? JSON.parse(savedLocal) : (window.EMBEDDED_STATE || DEFAULT_STATE);
      const rawDocs = Array.isArray(window.EMBEDDED_DOCUMENTS)
        ? window.EMBEDDED_DOCUMENTS
        : (window.EMBEDDED_DOCUMENTS && window.EMBEDDED_DOCUMENTS.documents) || [];
      docData = {
        documents: rawDocs.map((d) =>
          Object.assign({}, d, {
            url: d.drivePreviewUrl || ("./" + d.relPath),
            viewUrl: d.driveViewUrl || ("./" + d.relPath),
            transcriptUrl: d.transcriptRelPath ? "./" + d.transcriptRelPath : ""
          })
        )
      };
    } else {
      const [stRes, docRes] = await Promise.all([
        fetch("/api/state"),
        fetch("/api/documents")
      ]);
      stData = await stRes.json();
      docData = await docRes.json();
    }
    documentsList = docData.documents || [];
    document.getElementById("doc-count").textContent = documentsList.length;

    if (stData && stData.initialized) {
      appState = Object.assign({}, DEFAULT_STATE, stData);
      if (
        !stData.assets ||
        !stData.assets.some((a) => a.id === "divida_banco_carregado") ||
        !stData.assets.some((a) => a.id === "dinheiro_ouro_pai") ||
        !stData.assets.some((a) => a.id === "terrenos_alfeizerao" && (a.details || "").includes("USUCAPIÃO"))
      ) {
        appState.assets = JSON.parse(JSON.stringify(DEFAULT_STATE.assets));
      }
      if (!stData.taskViewMode || stData.taskViewMode === "role" || stData.taskViewMode === "step") {
        appState.taskViewMode = "grouped";
      }
      appState.roleFilter = "Todos";
      appState.tasks = DEFAULT_STATE.tasks.map((defT) => {
        const savedT = (stData.tasks || []).find((x) => x.id === defT.id);
        if (!savedT) return defT;
        return Object.assign({}, defT, {
          status: savedT.status || defT.status,
          substeps: defT.substeps.map((s, i) => ({
            text: s.text,
            done: savedT.substeps && savedT.substeps[i] ? !!savedT.substeps[i].done : false
          })),
          userNotes: savedT.userNotes || "",
          _open: savedT._open !== undefined ? savedT._open : false
        });
      });
      await saveState(true);
    } else {
      await saveState(true);
    }
  } catch (e) {
    console.error("Erro a carregar estado:", e);
  }
  applyTheme();
  updateGlobalProgress();
  syncNavPills();
  renderCurrentTab();
}

async function saveState(silent = false) {
  updateGlobalProgress();
  try {
    localStorage.setItem("heranca_serafim_state_v14", JSON.stringify(appState));
  } catch (err) {}
  const isCloudOrStandalone = window.location.protocol === "file:" || window.STANDALONE_DRIVE_MODE || window.CLOUD_ONLINE_MODE || window.location.hostname.includes("github.io");
  if (isCloudOrStandalone) {
    if (!silent) showToast("✓ Guardado no dispositivo");
    return;
  }
  try {
    await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(appState)
    });
    if (!silent) showToast("✓ Guardado (Mac + Google Drive)");
  } catch (e) {
    console.error("Erro a guardar:", e);
  }
}

function updateGlobalProgress() {
  const activeTasks = appState.tasks.filter((t) => t.status !== "nao_quero_fazer");
  if (activeTasks.length === 0) {
    document.getElementById("global-progress-pct").textContent = "100%";
    document.getElementById("global-progress-bar").style.width = "100%";
    return;
  }
  let totalPoints = 0;
  let earnedPoints = 0;
  activeTasks.forEach((t) => {
    const subs = t.substeps || [];
    const weight = subs.length > 0 ? subs.length : 1;
    totalPoints += weight;
    if (t.status === "feito") earnedPoints += weight;
    else earnedPoints += subs.filter((s) => s.done).length;
  });
  const pct = Math.round((earnedPoints / totalPoints) * 100);
  const doneCount = activeTasks.filter((t) => t.status === "feito").length;
  document.getElementById("global-progress-label").textContent = `${doneCount}/${activeTasks.length}`;
  document.getElementById("global-progress-pct").textContent = `${pct}%`;
  document.getElementById("global-progress-bar").style.width = `${pct}%`;
}

function getTaskProgressPct(task) {
  if (task.status === "feito") return 100;
  if (task.status === "nao_quero_fazer") return 0;
  const subs = task.substeps || [];
  if (subs.length === 0) return 0;
  const done = subs.filter((s) => s.done).length;
  return Math.round((done / subs.length) * 100);
}

function calculateDashboardTotals() {
  let totalCredits = 0;
  let totalDebits = 0;
  appState.assets.forEach((a) => {
    if (!a.enabled) return;
    const shareVal = (Number(a.totalValue) || 0) * ((Number(a.childrenSharePct) || 0) / 100);
    if (a.type === "credit") totalCredits += shareVal;
    else totalDebits += shareVal;
  });
  const netForChildren = totalCredits - totalDebits;
  const perChild = netForChildren / 3;
  const totalCostTasks = appState.tasks
    .filter((t) => t.status !== "nao_quero_fazer")
    .reduce((acc, t) => acc + (Number(t.cost) || 0), 0);

  return { totalCredits, totalDebits, netForChildren, perChild, totalCostTasks };
}

function refreshDashboardSummaryDOM(idx) {
  const totals = calculateDashboardTotals();

  const elSub = document.getElementById("kpi-net-sub");
  const elPer = document.getElementById("kpi-per-child");
  const elDiff = document.getElementById("kpi-diff-olha");

  if (elNet) elNet.textContent = fmtEur(totals.netForChildren);
  if (elSub) elSub.textContent = `+${fmtEur(totals.totalCredits)} / −${fmtEur(totals.totalDebits)}`;
  if (elPer) elPer.textContent = fmtEur(totals.perChild);
  if (elDiff) elDiff.textContent = `${diffVsOlha >= 0 ? "+" : ""}${fmtEur(diffVsOlha)}`;

  if (typeof idx === "number" && appState.assets[idx]) {
    const a = appState.assets[idx];
    const shareEur = (Number(a.totalValue) || 0) * ((Number(a.childrenSharePct) || 0) / 100);

    if (shareEl) shareEl.textContent = `${sign} ${fmtEur(shareEur)}`;
    if (perChildEl) perChildEl.textContent = `Por filho (÷3): ${fmtEur(shareEur / 3)}`;
  }
}

/* =========================================================
   2. PROCEDIMENTOS & TAREFAS (COMPACTO, DROPS FECHADOS)
   ========================================================= */
function setTaskViewMode(mode) {
  appState.taskViewMode = mode;
  saveState(true);
  renderCurrentTab();
}

function setRoleFilter(role) {
  appState.roleFilter = role;
  appState.focusedTaskIndex = 0;
  saveState(true);
  renderCurrentTab();
}

function setTaskStatus(taskId, newStatus) {
  const t = appState.tasks.find((x) => x.id === taskId);
  if (!t) return;
  t.status = newStatus;
  if (newStatus === "feito" && t.substeps) {
    t.substeps.forEach((s) => (s.done = true));
  }
  saveState();
  renderCurrentTab();
}

function toggleSubstep(taskId, subIdx, checked) {
  const t = appState.tasks.find((x) => x.id === taskId);
  if (!t || !t.substeps[subIdx]) return;
  t.substeps[subIdx].done = checked;
  const allDone = t.substeps.every((s) => s.done);
  if (allDone) t.status = "feito";
  else if (t.status === "feito") t.status = "por_fazer";
  saveState();
  renderCurrentTab();
}

function selectTaskTone(taskId, tone) {
  const t = appState.tasks.find((x) => x.id === taskId);
  if (!t) return;
  t.selectedTone = tone;
  t._msgOpen = true;
  const textarea = document.getElementById(`msg-${taskId}`);
  if (textarea && t.messages) {
    textarea.value = t.messages[tone] || "";
  }
  ["curto", "formal", "firme"].forEach((k) => {
    const btn = document.getElementById(`tone-btn-${taskId}-${k}`);
    if (btn) btn.classList.toggle("active", k === tone);
  });
  saveState(true);
}

function updateTaskMessageText(taskId, newText) {
  const t = appState.tasks.find((x) => x.id === taskId);
  if (!t) return;
  const tone = t.selectedTone || "curto";
  t.messages[tone] = newText;
  scheduleAutoSave();
}

function reformulateWithNote(taskId) {
  const t = appState.tasks.find((x) => x.id === taskId);
  if (!t) return;
  const noteInput = document.getElementById(`note-${taskId}`);
  const note = noteInput ? noteInput.value.trim() : "";
  if (!note) {
    showToast("Escreve uma nota primeiro");
    return;
  }
  t.userNotes = note;
  t._msgOpen = true;
  const tone = t.selectedTone || "curto";
  let current = t.messages[tone] || "";
  const marker = "\n\nNota Adicional:\n";
  if (current.includes(marker)) current = current.split(marker)[0];
  t.messages[tone] = `${current}${marker}- ${note}`;
  const textarea = document.getElementById(`msg-${taskId}`);
  if (textarea) textarea.value = t.messages[tone];
  saveState();
  showToast("Texto atualizado");
}

function copyTaskMessage(taskId) {
  const t = appState.tasks.find((x) => x.id === taskId);
  const textarea = document.getElementById(`msg-${taskId}`);
  const textToCopy = textarea ? textarea.value : (t ? t.messages[t.selectedTone || "curto"] : "");
  navigator.clipboard.writeText(textToCopy);
  showToast("📋 Mensagem copiada!");
}

function navigateFocusedTask(delta) {
  const filtered = getFilteredTasks();
  if (filtered.length === 0) return;
  appState.focusedTaskIndex = Math.max(0, Math.min(filtered.length - 1, appState.focusedTaskIndex + delta));
  saveState(true);
  renderCurrentTab();
}

function jumpToTask(taskId) {
  const idx = appState.tasks.findIndex((t) => t.id === taskId);
  if (idx >= 0) {
    appState.roleFilter = "Todos";
    appState.taskViewMode = "step";
    appState.focusedTaskIndex = idx;
    saveState(true);
    renderCurrentTab();
  }
}

function getFilteredTasks() {
  if (appState.roleFilter === "Todos") return appState.tasks;
  return appState.tasks.filter((t) => t.role === appState.roleFilter);
}

function toggleTaskCompletion(taskId) {
  const t = appState.tasks.find((x) => x.id === taskId);
  if (!t) return;
  const isDone = t.status === "feito";
  t.status = isDone ? "por_fazer" : "feito";
  if (t.substeps) {
    t.substeps.forEach((s) => (s.done = !isDone));
  }
  saveState();
  renderCurrentTab();
  showToast(isDone ? "Marcada como por fazer" : "✓ Tarefa concluída!");
}

function toggleTaskDetails(taskId) {
  const t = appState.tasks.find((x) => x.id === taskId);
  if (!t) return;
  t._open = !t._open;
  saveState(true);
  renderCurrentTab();
}

function toggleAllTasks(expand) {
  appState.tasks.forEach((t) => { t._open = expand; });
  saveState(true);
  renderCurrentTab();
}

  const isDone = t.status === "feito";

      <input type="checkbox" id="chk-${t.id}-${sIdx}" ${s.done ? "checked" : ""} onchange="toggleSubstep('${t.id}', ${sIdx}, this.checked)" />
      <label for="chk-${t.id}-${sIdx}" style="cursor: pointer; flex: 1;">${s.text}</label>
    </li>
  `).join("");

  return `
    <div class="apple-task-item ${isDone ? "is-done" : ""}">
      <div class="task-row-main" onclick="toggleTaskDetails('${t.id}')">
        <button class="task-checkbox-circle ${isDone ? "checked" : ""}" 
                onclick="event.stopPropagation(); toggleTaskCompletion('${t.id}')"
                title="${isDone ? "Marcar como por fazer" : "Marcar como concluída"}">

        <div class="task-row-info">

        <div class="task-row-actions" onclick="event.stopPropagation()">
          <select class="status-select status-${t.status}" onchange="setTaskStatus('${t.id}', this.value)">
            <option value="por_fazer" ${t.status === "por_fazer" ? "selected" : ""}>⏳ Por fazer</option>
            <option value="feito" ${t.status === "feito" ? "selected" : ""}>✓ Feito</option>
            <option value="nao_feito" ${t.status === "nao_feito" ? "selected" : ""}>! Pendente</option>
            <option value="nao_quero_fazer" ${t.status === "nao_quero_fazer" ? "selected" : ""}>✕ Ignorar</option>
          </select>
          <button class="btn-icon task-expand-btn ${isOpen ? "open" : ""}" onclick="toggleTaskDetails('${t.id}')" title="${isOpen ? "Recolher" : "Ver instruções e minuta"}">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

      ${isOpen ? `
        <div class="task-drawer">
          <div class="task-drawer-box">
            <div class="task-drawer-action-guide">
              <strong>Como Fazer:</strong> ${t.howTo}
            </div>

            <div style="margin-top: 12px;">
              <div style="font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 6px;">Passos a seguir</div>
              <ul class="substep-list">${substepsHtml}</ul>
            </div>

            <div style="margin-top: 14px; border-top: 1px solid var(--border-subtle); padding-top: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px;">
                <div style="font-size: 13.5px; font-weight: 600; color: var(--text);">Texto / Requerimento Pré-Formatado:</div>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <div class="seg-group">
                    <button id="tone-btn-${t.id}-curto" class="seg-btn ${tone === "curto" ? "active" : ""}" onclick="selectTaskTone('${t.id}', 'curto')">Curto</button>
                    <button id="tone-btn-${t.id}-formal" class="seg-btn ${tone === "formal" ? "active" : ""}" onclick="selectTaskTone('${t.id}', 'formal')">Formal</button>
                    <button id="tone-btn-${t.id}-firme" class="seg-btn ${tone === "firme" ? "active" : ""}" onclick="selectTaskTone('${t.id}', 'firme')">Firme</button>
                  </div>
                  ${t.proofDoc ? `<button class="btn btn-sm" onclick="openPreviewByRelPath('${t.proofDoc}')">📄 Prova</button>` : ""}
                  <button class="btn btn-sm btn-primary" onclick="copyTaskMessage('${t.id}')">📋 Copiar</button>
                </div>
              </div>

              <textarea id="msg-${t.id}" class="msg-textarea" oninput="updateTaskMessageText('${t.id}', this.value)">${currentMsg}</textarea>

              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <input id="note-${t.id}" class="note-input" value="${t.userNotes || ""}" placeholder="Adicionar nota pessoal..." />
                <button class="btn btn-sm" onclick="reformulateWithNote('${t.id}')">Inserir Nota</button>

function setDocSearch(val) {
  appState.docSearch = val;

  const input = document.getElementById("doc-search-input");
  if (input) {
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  }
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function getSearchSnippet(text, query) {
  if (!query || !text) return "";
  const lower = text.toLowerCase();
  const qLower = query.toLowerCase();
  const idx = lower.indexOf(qLower);
  if (idx === -1) return "";
  const start = Math.max(0, idx - 75);
  const end = Math.min(text.length, idx + query.length + 95);
  let rawSlice = text.slice(start, end).replace(/\s+/g, " ").trim();
  const safeSlice = escapeHtml(rawSlice);
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
  const highlighted = safeSlice.replace(regex, `<mark style="background: rgba(255, 214, 10, 0.45); color: inherit; padding: 0 4px; border-radius: 4px; font-weight: 600;">$1</mark>`);
  return (start > 0 ? "…" : "") + highlighted + (end < text.length ? "…" : "");
}

async function openPreviewByRelPath(relPath, mode = "original") {
  const doc = documentsList.find((d) => d.relPath === relPath || d.id === relPath) || {
    id: relPath,
    title: relPath.split("/").pop(),
    relPath,
    url: "/files/" + encodeURI(relPath),
    ext: relPath.split(".").pop().toLowerCase(),
    transcriptText: ""
  };

  currentPreviewDoc = doc;
  currentPreviewMode = mode;

  const ws = document.getElementById("main-workspace");
  const panel = document.getElementById("preview-panel");
  const titleEl = document.getElementById("preview-title");
  const newTabBtn = document.getElementById("preview-newtab-btn");
  const finderBtn = document.getElementById("preview-finder-btn");

  ws.classList.add("with-preview");
  panel.style.display = "flex";
  titleEl.textContent = doc.title;
  newTabBtn.href = doc.driveViewUrl || doc.viewUrl || (mode === "transcript" && doc.transcriptUrl ? doc.transcriptUrl : doc.url);
  finderBtn.onclick = () => openInFinder(mode === "transcript" && doc.transcriptRelPath ? doc.transcriptRelPath : doc.relPath, true);

  renderPreviewBody();
}

function switchPreviewMode(mode) {
  currentPreviewMode = mode;
  renderPreviewBody();
}

function formatInlineMd(text) {
  let s = escapeHtml(text || "");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}

function renderPrettyMarkdown(rawText) {
  const lines = (rawText || "").replace(/\r\n/g, "\n").split("\n");
  let html = `<div class="md-doc-viewer">`;
  let inTable = false;
  let tableHeaderDone = false;
  let inList = false;
  let listTag = "ul";

  const closeList = () => {
    if (inList) {
      html += `</${listTag}>`;
      inList = false;
    }
  };

  const closeTable = () => {
    if (inTable) {
      html += `</tbody></table></div>`;
      inTable = false;
      tableHeaderDone = false;
    }
  };

  for (let i = 0; i < lines.length; i++) {
    const rawLine = lines[i];
    const line = rawLine.trim();

    if (!line) {
      closeList();
      closeTable();
      continue;
    }

    // Tabelas Markdown: | col1 | col2 |
    if (line.startsWith("|") && line.endsWith("|")) {
      closeList();
      const cells = line
        .slice(1, -1)
        .split("|")
        .map((c) => c.trim());

      // Linha separadora |---|---|
      if (cells.every((c) => /^[:\-]+$/.test(c))) {
        continue;
      }

      if (!inTable) {
        inTable = true;
        tableHeaderDone = false;
        html += `<div class="md-table-wrap"><table>`;
      }

      if (!tableHeaderDone) {
        html += `<thead><tr>${cells.map((c) => `<th>${formatInlineMd(c)}</th>`).join("")}</tr></thead><tbody>`;
        tableHeaderDone = true;
      } else {
        html += `<tr>${cells.map((c) => {
          const formatted = formatInlineMd(c);
          // Destacar valores em euros ou negativos/positivos
          const isNum = /[0-9],[0-9]{2}|€/.test(c);
          return `<td style="${isNum ? "font-variant-numeric: tabular-nums; white-space: nowrap;" : ""}">${formatted}</td>`;
        }).join("")}</tr>`;
      }
      continue;
    } else {
      closeTable();
    }

    // Linha horizontal
    if (/^[-*_]{3,}$/.test(line)) {
      closeList();
      html += `<hr />`;
      continue;
    }

    // Cabeçalhos
    if (line.startsWith("### ")) {
      closeList();
      html += `<h3>${formatInlineMd(line.slice(4))}</h3>`;
      continue;
    }
    if (line.startsWith("## ")) {
      closeList();
      html += `<h2>${formatInlineMd(line.slice(3))}</h2>`;
      continue;
    }
    if (line.startsWith("# ")) {
      closeList();
      html += `<h1>${formatInlineMd(line.slice(2))}</h1>`;
      continue;
    }

    // Blockquotes (> ...)
    if (line.startsWith(">")) {
      closeList();
      html += `<blockquote>${formatInlineMd(line.replace(/^>\s*/, ""))}</blockquote>`;
      continue;
    }

    // Listas com marcadores (-, *, •, –)
    if (/^([-*•–])\s+/.test(line)) {
      if (!inList || listTag !== "ul") {
        closeList();
        inList = true;
        listTag = "ul";
        html += `<ul>`;
      }
      html += `<li>${formatInlineMd(line.replace(/^([-*•–])\s+/, ""))}</li>`;
      continue;
    }

    // Listas numeradas (1., 2., etc.)
    if (/^\d+[.)]\s+/.test(line)) {
      if (!inList || listTag !== "ol") {
        closeList();
        inList = true;
        listTag = "ol";
        html += `<ol>`;
      }
      html += `<li>${formatInlineMd(line.replace(/^\d+[.)]\s+/, ""))}</li>`;
      continue;
    }

    closeList();
    html += `<p>${formatInlineMd(line)}</p>`;
  }

  closeList();
  closeTable();
  html += `</div>`;
  return html;
}

let isEditingTranscript = false;

function toggleTranscriptEditMode(editMode) {
  isEditingTranscript = editMode;
  renderPreviewBody();
}

async function renderPreviewBody() {
  if (!currentPreviewDoc) return;
  const doc = currentPreviewDoc;
  const body = document.getElementById("preview-body");
  const btnOrig = document.getElementById("btn-prev-orig");
  const btnTrans = document.getElementById("btn-prev-trans");
  const newTabBtn = document.getElementById("preview-newtab-btn");
  const finderBtn = document.getElementById("preview-finder-btn");

  if (btnOrig) btnOrig.classList.toggle("active", currentPreviewMode === "original");
  if (btnTrans) btnTrans.classList.toggle("active", currentPreviewMode === "transcript");

  if (currentPreviewMode === "transcript") {
    newTabBtn.href = doc.transcriptUrl || doc.url;
    finderBtn.onclick = () => openInFinder(doc.transcriptRelPath || doc.relPath, true);
    const txt = doc.transcriptText || "Sem transcrição registada.";

    if (isEditingTranscript) {
      body.innerHTML = `
        <div style="display: flex; flex-direction: column; width: 100%; height: 100%; padding: 10px; gap: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 6px;">
            <span style="font-size: 11px; color: var(--text-muted);">✏️ Modo Edição da Transcrição:</span>
            <div style="display: flex; gap: 4px;">
              <button class="btn btn-sm" onclick="toggleTranscriptEditMode(false)">👁️ Ver Formatado</button>
              <button class="btn btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('inline-trans-edit').value); showToast('Transcrição copiada!')">📋 Copiar</button>
              <button class="btn btn-sm btn-primary" onclick="saveInlineTranscript('${doc.id}')">💾 Guardar</button>
            </div>
          </div>
          <textarea id="inline-trans-edit" class="msg-textarea" style="flex: 1; height: 100%; margin: 0; font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.45;">${escapeHtml(txt)}</textarea>
        </div>
      `;
    } else {
      body.innerHTML = `
        <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);">
            <span style="font-size: 11px; color: var(--text-muted);">📖 Leitura Limpa & Formatada</span>
            <div style="display: flex; gap: 4px;">
              <button class="btn btn-sm" onclick="navigator.clipboard.writeText(currentPreviewDoc.transcriptText || ''); showToast('Texto copiado!')">📋 Copiar</button>
              <button class="btn btn-sm btn-primary" onclick="toggleTranscriptEditMode(true)">✏️ Editar Texto</button>
            </div>
          </div>
          <div style="flex: 1; overflow: auto;">
            ${renderPrettyMarkdown(txt)}
          </div>
        </div>
      `;
    }
    return;
  }

  newTabBtn.href = doc.driveViewUrl || doc.viewUrl || doc.url;
  finderBtn.onclick = () => openInFinder(doc.relPath, true);

  const isCloud = window.CLOUD_ONLINE_MODE || window.location.hostname.includes("github.io");
  if (isCloud && doc.drivePreviewUrl) {
    body.innerHTML = `
      <div style="display:flex; flex-direction:column; width:100%; height:100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--surface-subtle); gap:8px; flex-wrap:wrap;">
          <span style="font-size:12px; color:var(--text-muted);">☁️ Ligado à Google Drive (angelo.bartolo@signomy.com)</span>
          <div style="display:flex; gap:6px;">
            <a class="btn btn-sm btn-primary" href="${doc.driveViewUrl}" target="_blank" rel="noopener">📂 Abrir Ficheiro na Google Drive ↗</a>
            <button class="btn btn-sm" onclick="switchPreviewMode('transcript')">📝 Ver Transcrição Completa</button>
          </div>
        </div>
        <iframe src="${doc.drivePreviewUrl}" style="flex:1; border:none; width:100%;"></iframe>
      </div>
    `;
  } else if (doc.ext === "pdf") {
    body.innerHTML = `<iframe src="${doc.url}"></iframe>`;
  } else if (["jpg", "jpeg", "png"].includes(doc.ext)) {
    body.innerHTML = `<div style="padding: 8px; overflow: auto; width: 100%; height: 100%;"><img src="${doc.url}" alt="${escapeHtml(doc.title)}" /></div>`;
  } else {
    body.innerHTML = `<div class="md-doc-viewer">A carregar documento...</div>`;
    try {
      const res = await fetch(doc.url);
      const txt = await res.text();
      body.innerHTML = renderPrettyMarkdown(txt);
    } catch (e) {
      body.innerHTML = `<div class="md-doc-viewer">Erro ao abrir ficheiro.</div>`;
    }
  }
}

async function saveInlineTranscript(docId) {
  const el = document.getElementById("inline-trans-edit");
  if (!el) return;
  const newText = el.value;
  const res = await fetch("/api/documents/update", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: docId, transcriptText: newText })
  });
  const data = await res.json();
  if (data.ok) {
    documentsList = data.documents;
    currentPreviewDoc = documentsList.find((d) => d.id === docId) || currentPreviewDoc;
    isEditingTranscript = false;
    renderPreviewBody();
    showToast("Transcrição guardada!");
    if (appState.activeTab === "documentos") renderCurrentTab();
  }
}

function openAddDocModal() {
  document.getElementById("doc-modal-heading").textContent = "+ Adicionar Novo Documento";
  document.getElementById("doc-modal-id").value = "";
  document.getElementById("doc-modal-title").value = "";
  document.getElementById("doc-modal-category").value = "1. Habilitação & Finanças";
  document.getElementById("doc-modal-essential").checked = false;
  document.getElementById("doc-modal-file").value = "";
  document.getElementById("doc-modal-file-wrap").style.display = "block";
  document.getElementById("doc-modal-transcript").value = "";
  document.getElementById("doc-modal").showModal();
}

function openEditDocModal(docId) {
  const doc = documentsList.find((d) => d.id === docId);
  if (!doc) return;
  document.getElementById("doc-modal-heading").textContent = "✏️ Alterar Documento / Transcrição";
  document.getElementById("doc-modal-id").value = doc.id;
  document.getElementById("doc-modal-title").value = doc.title;
  document.getElementById("doc-modal-category").value = doc.category;
  document.getElementById("doc-modal-essential").checked = !!doc.essential;
  document.getElementById("doc-modal-file-wrap").style.display = "none";
  document.getElementById("doc-modal-transcript").value = doc.transcriptText || "";
  document.getElementById("doc-modal").showModal();
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveDocModal() {
  const docId = document.getElementById("doc-modal-id").value;
  const title = document.getElementById("doc-modal-title").value.trim();
  const category = document.getElementById("doc-modal-category").value;
  const essential = document.getElementById("doc-modal-essential").checked;
  const transcriptText = document.getElementById("doc-modal-transcript").value;
  const fileInput = document.getElementById("doc-modal-file");

  if (!title) {
    showToast("Indica o título do documento");
    return;
  }

  const saveBtn = document.getElementById("doc-modal-save-btn");
  saveBtn.textContent = "A guardar / transcrever...";
  saveBtn.disabled = true;

  try {
    if (docId) {
      // Editar documento existente
      const res = await fetch("/api/documents/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: docId, title, category, essential, transcriptText })
      });
      const data = await res.json();
      if (data.ok) {
        documentsList = data.documents;
        document.getElementById("doc-count").textContent = documentsList.length;
        showToast("Documento atualizado");
      }
    } else {
      // Adicionar novo documento (com OCR automático se carregar ficheiro)
      let fileName = "";
      let fileBase64 = "";
      if (fileInput.files && fileInput.files[0]) {
        fileName = fileInput.files[0].name;
        fileBase64 = await readFileAsDataURL(fileInput.files[0]);
      }
      const res = await fetch("/api/documents/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, category, essential, transcriptText, fileName, fileBase64 })
      });
      const data = await res.json();
      if (data.ok) {
        documentsList = data.documents;
        document.getElementById("doc-count").textContent = documentsList.length;
        showToast("Novo documento adicionado e transcrito!");
      }
    }
    document.getElementById("doc-modal").close();
    renderCurrentTab();
  } catch (e) {
    console.error(e);
    showToast("Erro ao guardar documento");
  } finally {
    saveBtn.textContent = "Guardar Documento";
    saveBtn.disabled = false;
  }
}

async function deleteDoc(docId) {
  const doc = documentsList.find((d) => d.id === docId);
  if (!doc) return;
  if (!confirm(`Apagar o documento "${doc.title}" da lista?`)) return;
  const res = await fetch("/api/documents/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: docId })
  });
  const data = await res.json();
  if (data.ok) {
    documentsList = data.documents;
    document.getElementById("doc-count").textContent = documentsList.length;
    if (currentPreviewDoc && currentPreviewDoc.id === docId) closePreview();
    renderCurrentTab();
    showToast("Documento removido");
  }
}

function closePreview() {
  document.getElementById("main-workspace").classList.remove("with-preview");
  document.getElementById("preview-panel").style.display = "none";
  document.getElementById("preview-body").innerHTML = "";
  currentPreviewDoc = null;
}

async function openInFinder(relPath, reveal = true) {
  await fetch("/api/open-finder", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ relPath, reveal })
  });
}

function exportSummaryReport() {
  window.print();
}

window.addEventListener("DOMContentLoaded", loadState);

</script>
